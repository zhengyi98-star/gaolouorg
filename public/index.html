<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>高楼之巅 | gaolou.org</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

<style>
  :root{
    --ease-slow: cubic-bezier(0.22, 1, 0.36, 1);
    --ui-fade-in: 1.1s;
    --ui-fade-out: 1.8s;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    width:100%; height:100%;
    overflow:hidden;
    /* 即使视频加载失败，也不会是死气沉沉的纯黑，而是一层有呼吸感的夜色渐变 */
    background: radial-gradient(ellipse at 50% 40%, #1b212c 0%, #0a0c10 65%, #050608 100%);
    font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    cursor: default;
  }

  /* ============ 原生 <video> 背景层 ============ */
  /* 纯 CSS 满铺裁切方案：min-width/min-height 保证视频永远盖满视口，
     object-fit: cover 负责按比例裁切多余部分，双重保险杜绝黑边、白边与拉伸 */

  .bg-video{
    position:fixed;
    right:0;
    bottom:0;
    min-width:100%;
    min-height:100%;
    width:auto;
    height:auto;
    object-fit:cover;
    z-index:0;                /* 改用 0 而非负数 —— 负 z-index 叠加 <video> 在 Chromium 上
                                  有已知的 GPU 合成层顺序 bug，容易导致视频被错误地画到
                                  画布背景之下，表现为“明明在播放却是纯黑” */
    pointer-events:none;      /* 关键防干扰：彻底禁止对背景视频的任何点击/长按交互 */
    user-select:none;
    opacity:0;
    transition: opacity 1.2s ease;
    background:#000;
  }

  /* 双 video 叠层，用于无闪烁的平滑交叉淡入淡出切换 */
  .bg-video.active{
    opacity:1;
  }

  /* 夜间遮罩滤镜层：压暗视频，保证悬浮文字清晰可读
     注意：这里刻意不用 backdrop-filter —— 它在采样 <video> 元素背后画面时
     在 Chromium 上有已知问题（视频常被提升到独立合成层，backdrop-filter 采样不到，
     导致整层渲染成纯黑），改用纯色半透明叠加来压暗，效果一致且稳定可靠 */
  #bg-veil{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background: rgba(0,0,0,0.42);
  }

  /* 极轻的四角暗角，增加纵深与高级感 */
  #bg-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%);
  }

  /* ============ 界面总容器：负责统一呼吸式显隐 ============ */

  .ui-layer{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
  }

  .ui-fade{
    opacity:0;
    transition: opacity var(--ui-fade-out) var(--ease-slow);
    pointer-events:none;
  }
  body.ui-visible .ui-fade{
    opacity:1;
    transition: opacity var(--ui-fade-in) var(--ease-slow);
    pointer-events:auto;
  }

  /* 冥想模式：强制在 1 秒内彻底隐藏主界面，且无论鼠标如何移动都不再唤醒 */
  body.meditating .ui-fade{
    opacity:0 !important;
    pointer-events:none !important;
    transition: opacity 1s var(--ease-slow) !important;
  }
  body.meditating{
    cursor:none;
  }

  /* ============ 左上角：品牌文案组 ============ */

  .brand{
    position:fixed;
    top:5.5vh;
    left:5.5vw;
    z-index:11;
    text-align:left;
    user-select:none;
  }

  .brand__title{
    font-family: 'Noto Sans SC', sans-serif;
    font-weight:300;
    font-size:1.2rem;
    letter-spacing:0.18em;
    color:rgba(255,255,255,0.92);
    text-shadow: 0 1px 12px rgba(0,0,0,0.35);
  }

  .brand__title .en{
    font-family: 'Cormorant Garamond', 'Noto Sans SC', serif;
    font-style: italic;
    font-weight:300;
    letter-spacing:0.06em;
    opacity:0.75;
    margin-left:0.5em;
    font-size:0.92em;
  }

  .brand__divider{
    display:block;
    width:22px;
    height:1px;
    background:rgba(255,255,255,0.4);
    margin:0.85em 0;
  }

  .brand__subtitle{
    font-weight:300;
    font-size:0.9rem;
    letter-spacing:0.12em;
    color:rgba(255,255,255,0.6);
  }

  /* ============ 下方正中：毛玻璃控制面板 ============ */

  .control-panel{
    position:fixed;
    left:50%;
    bottom:6vh;
    transform:translateX(-50%);
    z-index:11;
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px 14px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }

  .scene-btn{
    appearance:none;
    -webkit-appearance:none;
    border:0;
    background:transparent;
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    transition: background 0.5s ease, transform 0.4s ease;
  }

  .scene-btn:hover{
    background:rgba(255,255,255,0.09);
  }

  .scene-btn svg{
    width:18px;
    height:18px;
    stroke:rgba(255,255,255,0.62);
    stroke-width:1;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition: stroke 0.5s ease, opacity 0.5s ease;
  }

  .scene-btn.active{
    background:rgba(255,255,255,0.13);
  }
  .scene-btn.active svg{
    stroke:rgba(255,255,255,0.98);
  }

  .scene-btn__label{
    position:absolute;
    bottom:calc(100% + 10px);
    left:50%;
    transform:translateX(-50%) translateY(4px);
    white-space:nowrap;
    font-size:0.68rem;
    letter-spacing:0.15em;
    font-weight:300;
    color:rgba(255,255,255,0.85);
    background:rgba(0,0,0,0.4);
    padding:4px 10px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    backdrop-filter: blur(6px);
  }

  .scene-btn:hover .scene-btn__label{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .panel-divider{
    width:1px;
    height:18px;
    background:rgba(255,255,255,0.16);
    margin:0 2px;
  }

  /* ============ 冥想时长气泡菜单 ============ */

  .time-picker{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:230px;
    padding:16px 18px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .time-picker.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  body.meditating .time-picker{
    opacity:0 !important;
    pointer-events:none !important;
  }

  /* ============ 支持我们 · 赞助/好物推荐气泡菜单 ============ */
  /* 与 .time-picker 同一套毛玻璃语言，保持视觉统一；默认不参与 3 秒静止隐形，
     仅在用户主动点开时出现，关闭方式与冥想时长菜单完全一致 */

  .support-panel{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:250px;
    max-width:86vw;
    padding:18px 20px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:12px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .support-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  body.meditating .support-panel{
    opacity:0 !important;
    pointer-events:none !important;
  }

  .support-panel__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
    text-align:center;
  }

  .support-panel__afdian{
    display:block;
    text-align:center;
    text-decoration:none;
    font-family:inherit;
    font-weight:300;
    font-size:0.8rem;
    letter-spacing:0.08em;
    color:rgba(255,255,255,0.92);
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:999px;
    padding:9px 18px;
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .support-panel__afdian:hover{
    background:rgba(255,255,255,0.18);
    border-color:rgba(255,255,255,0.6);
  }

  .support-panel__divider{
    width:100%;
    height:1px;
    background:rgba(255,255,255,0.12);
    margin:2px 0;
  }

  .support-panel__goods-label{
    font-size:0.62rem;
    letter-spacing:0.18em;
    font-weight:300;
    color:rgba(255,255,255,0.4);
    text-align:center;
  }

  .support-panel__goods{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
  }

  .support-panel__goods a{
    text-decoration:none;
    font-family:inherit;
    font-weight:300;
    font-size:0.72rem;
    letter-spacing:0.05em;
    color:rgba(255,255,255,0.7);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:999px;
    padding:6px 13px;
    transition: color 0.4s ease, border-color 0.4s ease;
  }
  .support-panel__goods a:hover{
    color:rgba(255,255,255,0.98);
    border-color:rgba(255,255,255,0.5);
  }

  .support-panel__disclosure{
    font-size:0.58rem;
    letter-spacing:0.04em;
    color:rgba(255,255,255,0.28);
    text-align:center;
    line-height:1.5;
  }

  .time-picker__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
  }

  .time-picker__options{
    display:flex;
    gap:8px;
  }

  .time-picker__option{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.04);
    color:rgba(255,255,255,0.75);
    font-family:inherit;
    font-weight:300;
    font-size:0.75rem;
    letter-spacing:0.08em;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }

  .time-picker__option:hover{
    border-color:rgba(255,255,255,0.45);
  }

  .time-picker__option.selected{
    background:rgba(255,255,255,0.85);
    color:rgba(10,10,10,0.85);
    border-color:rgba(255,255,255,0.85);
  }

  .time-picker__start{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.3);
    background:transparent;
    color:rgba(255,255,255,0.35);
    font-family:inherit;
    font-weight:300;
    font-size:0.78rem;
    letter-spacing:0.25em;
    padding:8px 26px;
    border-radius:999px;
    cursor:not-allowed;
    transition: all 0.4s ease;
  }

  .time-picker__start.enabled{
    color:rgba(255,255,255,0.95);
    border-color:rgba(255,255,255,0.7);
    cursor:pointer;
  }
  .time-picker__start.enabled:hover{
    background:rgba(255,255,255,0.12);
  }

  /* ============ 中央呼吸冥想气泡（Pixel Thoughts 致敬）============ */

  .meditation-layer{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:32px;
    opacity:0;
    pointer-events:none;
    transition: opacity 1.4s var(--ease-slow);
  }
  .meditation-layer.active{
    opacity:1;
    pointer-events:auto;
  }

  .breath-bubble{
    width:80px;
    height:80px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 35% 32%, rgba(255,255,255,0.4), rgba(255,255,255,0.05) 72%);
    border:1px solid rgba(255,255,255,0.4);
    animation: breathe 8s ease-in-out infinite;
    will-change: transform, box-shadow;
  }

  @keyframes breathe{
    0%   { transform:scale(1);    box-shadow:0 0 20px 4px rgba(255,255,255,0.14), 0 0 46px 14px rgba(255,255,255,0.05); }
    50%  { transform:scale(1.85); box-shadow:0 0 60px 20px rgba(255,255,255,0.32), 0 0 120px 36px rgba(255,255,255,0.12); }
    100% { transform:scale(1);    box-shadow:0 0 20px 4px rgba(255,255,255,0.14), 0 0 46px 14px rgba(255,255,255,0.05); }
  }

  .breath-bubble__text{
    font-weight:300;
    font-size:0.78rem;
    letter-spacing:0.15em;
    color:rgba(255,255,255,0.88);
    transition: opacity 0.6s ease;
    white-space:nowrap;
  }

  .breath-countdown{
    font-weight:300;
    font-size:0.72rem;
    letter-spacing:0.22em;
    color:rgba(255,255,255,0.38);
    font-variant-numeric: tabular-nums;
  }

  .breath-hint{
    position:fixed;
    bottom:4.5vh;
    left:50%;
    transform:translateX(-50%);
    font-size:0.62rem;
    letter-spacing:0.12em;
    color:rgba(255,255,255,0.26);
    font-weight:300;
    white-space:nowrap;
  }

  /* ============ 移动端适配 ============ */

  @media (max-width: 640px){
    .brand{ top:6.5vh; left:6vw; }
    .brand__title{ font-size:1.05rem; }
    .brand__subtitle{ font-size:0.78rem; }
    .control-panel{ bottom:5vh; padding:8px 10px; gap:2px; }
    .scene-btn{ width:38px; height:38px; }
    .scene-btn__label{ display:none; } /* 触屏无 hover，隐藏文字气泡 */
    .time-picker{ bottom:calc(5vh + 66px); min-width:210px; }
    .support-panel{ bottom:calc(5vh + 66px); min-width:210px; }
  }

  /* 无障碍：尊重系统的“减少动态效果”偏好 */
  @media (prefers-reduced-motion: reduce){
    .ui-fade{ transition-duration: 0.2s !important; }
    .bg-video{ transition-duration: 0.2s !important; }
    .breath-bubble{ animation-duration: 12s; }
  }
</style>
</head>

  <!-- ============ 原生 HTML5 视频背景（已彻底移除 iframe，无第三方广告/跳转）============ -->
  <video id="bg-video-1" class="bg-video" autoplay loop muted playsinline preload="auto"></video>

  <div id="bg-veil"></div>

  <div class="ui-layer">

  <!-- ============ 冥想时长选择气泡菜单 ============ -->
  <div class="time-picker" id="timePicker">
    <div class="time-picker__label">留白多久</div>
    <div class="time-picker__options">
      <button class="time-picker__option" data-min="1">1 分钟</button>
      <button class="time-picker__option" data-min="3">3 分钟</button>
      <button class="time-picker__option" data-min="5">5 分钟</button>
    </div>
    <button class="time-picker__start" id="startMeditation">开始</button>
  </div>

  <!-- ============ 中央呼吸冥想层 ============ -->
  <div class="meditation-layer" id="meditationLayer" aria-hidden="true">
    <div class="breath-bubble" id="breathBubble">
      <span class="breath-bubble__text" id="breathText">吸气...</span>
    </div>
    <div class="breath-countdown" id="breathCountdown">00:00</div>
    <div class="breath-hint">按 Esc 或双击屏幕，随时回到高楼之巅</div>
  </div>

<script>
(function(){

  // ============================================================
  // 1. 场景配置 —— 每个场景可以挂任意数量的视频，素材库大小完全灵活，
  //    往数组里加/删链接即可，不用碰下面的任何逻辑代码。
  //    每次切换到某个场景时会从对应数组里随机抽一条播放，
  //    且会避开"刚刚放过的那一条"，让老用户多次访问也不容易看腻。
  // ============================================================
  var SCENES = {
    chongqing: {
      name:'魔幻重庆',
      videos:[
        '/videos/chongqing-1.mp4',
        '/videos/chongqing-2.mp4',
        '/videos/chongqing-3.mp4'
        // 继续往下加即可，如 '/videos/chongqing-4.mp4', ...
      ]
    },
    shanghai: {
      name:'都市上海',
      videos:[
        '/videos/shanghai-1.mp4',
        '/videos/shanghai-2.mp4',
        '/videos/shanghai-3.mp4'
      ]
    },
    snowmountain: {
      name:'治愈雪山',
      videos:[
        '/videos/snowmountain-1.mp4',
        '/videos/snowmountain-2.mp4',
        '/videos/snowmountain-3.mp4'
      ]
    },
    cyberpunk: {
      name:'虚拟夜之城',
      videos:[
        '/videos/cyberpunk-1.mp4',
        '/videos/cyberpunk-2.mp4',
        '/videos/cyberpunk-3.mp4'
      ]
    }
  };

  var SCENE_KEYS = Object.keys(SCENES);
  // 每次打开网站，起始场景也随机挑一个分类，配合场景内随机选片，
  // 让"多次登录不觉得单调"从进站第一眼就成立
  var DEFAULT_SCENE = SCENE_KEYS[Math.floor(Math.random() * SCENE_KEYS.length)];

  // 记住每个场景上一次放过的是哪一条，抽取时尽量避开，减少"刚看过又是它"的重复感
  var lastPlayedIndex = {};

  function pickVideoSrc(key){
    var list = SCENES[key] && SCENES[key].videos;
    if (!list || !list.length) return null;
    if (list.length === 1) return list[0];

    var idx;
    do {
      idx = Math.floor(Math.random() * list.length);
    } while (idx === lastPlayedIndex[key]);

    lastPlayedIndex[key] = idx;
    return list[idx];
  }

  var videos = [document.getElementById('bg-video-1'), document.getElementById('bg-video-2')];
  var activeIndex = 0;
  var sceneButtons = document.querySelectorAll('.scene-btn[data-scene]');

  // 若视频源被防盗链拦截、404 或格式不支持，会在控制台给出明确诊断信息，
  // 而不是让页面无声无息地停留在纯黑背景上
  videos.forEach(function(v){
    v.addEventListener('error', function(){
      console.error(
        '[高楼之巅] 背景视频加载失败：' + (v.currentSrc || v.src) +
        '\n常见原因：1) 视频源开启了防盗链（Referer 校验），需自建托管；' +
        '2) 链接失效或跨域被拒绝；3) 网络无法访问该域名。'
      );
    });
  });

  // ============================================================
  // 2. 平滑无闪烁切换：双 <video> 交叉淡入淡出
  //    下一个视频在后台加载完成（canplay）后才开始播放与淡入，
  //    旧视频待完全淡出后才暂停，因此切换全程不会出现黑屏或闪烁
  // ============================================================
  function switchScene(key){
    var scene = SCENES[key];
    if (!scene) return;

    var pickedSrc = pickVideoSrc(key);
    if (!pickedSrc) return;

    var activeVideo = videos[activeIndex];
    var nextIndex   = 1 - activeIndex;
    var nextVideo   = videos[nextIndex];
    var triggered   = false;
    var fallbackTimer = null;

    function onReady(){
      if (triggered) return;
      triggered = true;
      nextVideo.removeEventListener('loadeddata', onReady);
      nextVideo.removeEventListener('canplay', onReady);
      clearTimeout(fallbackTimer);

      var playPromise = nextVideo.play();
      if (playPromise && playPromise.catch){
        playPromise.catch(function(err){
          console.warn('[高楼之巅] 视频播放被浏览器拦截或失败：', err, nextVideo.currentSrc);
        });
      }

      nextVideo.classList.add('active');
      activeVideo.classList.remove('active');
      activeIndex = nextIndex;

      // 等旧视频完全淡出（与 CSS 的 1.2s 过渡时间对应）后再暂停，节省性能
      setTimeout(function(){
        activeVideo.pause();
      }, 1300);
    }

    // 双重监听：loadeddata（首帧可用）和 canplay（可流畅播放）任一先触发即可，
    // 避免某些浏览器/编码组合下 canplay 迟迟不触发导致画面卡在黑屏
    nextVideo.addEventListener('loadeddata', onReady);
    nextVideo.addEventListener('canplay', onReady);

    // 3 秒硬性兜底：即使两个事件都没等到，也强制显示，避免无限期黑屏
    fallbackTimer = setTimeout(function(){
      if (!triggered){
        console.warn('[高楼之巅] 视频 3 秒内未触发 loadeddata/canplay，已强制显示：', pickedSrc);
      }
      onReady();
    }, 3000);

    nextVideo.src = pickedSrc;
    nextVideo.load();

    sceneButtons.forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.scene === key);
    });
  }

  sceneButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      switchScene(btn.dataset.scene);
    });
  });

  switchScene(DEFAULT_SCENE);

  // ============================================================
  // 3. 智能隐形逻辑（鼠标静止 3 秒自动隐藏）
  // ============================================================
  var hideTimer = null;
  var HIDE_DELAY = 3000;

  function wake(){
    // 冥想模式下彻底冻结此逻辑：无论怎样移动鼠标，界面都绝不重新出现
    if (document.body.classList.contains('meditating')) return;

    document.body.classList.add('ui-visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
      document.body.classList.remove('ui-visible');
    }, HIDE_DELAY);
  }

  ['mousemove', 'mousedown', 'touchstart', 'touchmove', 'keydown', 'wheel'].forEach(function(evt){
    window.addEventListener(evt, wake, { passive:true });
  });

  wake();

  window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // ============================================================
  // 4. 冥想发呆 —— 时长选择气泡菜单 ｜ 支持我们 —— 赞助与好物气泡菜单
  //    两个气泡菜单共用同一套“互斥展开、点外部收起”的逻辑
  // ============================================================
  var meditateBtn   = document.getElementById('meditateBtn');
  var timePicker    = document.getElementById('timePicker');
  var durationBtns  = document.querySelectorAll('.time-picker__option');
  var startBtn      = document.getElementById('startMeditation');

  var supportBtn    = document.getElementById('supportBtn');
  var supportPanel  = document.getElementById('supportPanel');

  var selectedMinutes = null;

  function closeTimePicker(){
    timePicker.classList.remove('open');
    meditateBtn.classList.remove('active');
  }
  function closeSupportPanel(){
    supportPanel.classList.remove('open');
    supportBtn.classList.remove('active');
  }

  meditateBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willOpen = !timePicker.classList.contains('open');
    closeSupportPanel();
    timePicker.classList.toggle('open', willOpen);
    meditateBtn.classList.toggle('active', willOpen);
  });

  supportBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willOpen = !supportPanel.classList.contains('open');
    closeTimePicker();
    supportPanel.classList.toggle('open', willOpen);
    supportBtn.classList.toggle('active', willOpen);
  });

  durationBtns.forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      durationBtns.forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      selectedMinutes = parseInt(btn.dataset.min, 10);
      startBtn.classList.add('enabled');
    });
  });

  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (!selectedMinutes) return;
    closeTimePicker();
    startMeditation(selectedMinutes);
  });

  // 点击任一气泡菜单以外的区域，优雅收起（两个菜单共用这一套判断）
  document.addEventListener('click', function(e){
    if (timePicker.classList.contains('open') &&
        !timePicker.contains(e.target) &&
        !meditateBtn.contains(e.target)){
      closeTimePicker();
    }
    if (supportPanel.classList.contains('open') &&
        !supportPanel.contains(e.target) &&
        !supportBtn.contains(e.target)){
      closeSupportPanel();
    }
  });

  // ============================================================
  // 5. 进入冥想（开启精神留白）—— 呼吸引导气泡
  // ============================================================
  var meditationLayer = document.getElementById('meditationLayer');
  var breathText       = document.getElementById('breathText');
  var breathCountdown  = document.getElementById('breathCountdown');

  var countdownTimer  = null;
  var breathTextTimer = null;
  var remainingSeconds = 0;

  function startMeditation(minutes){
    remainingSeconds = minutes * 60;
    updateCountdownDisplay();

    // 5.1 主界面在 1 秒内彻底冻结、淡出（由 body.meditating 的 CSS 强制接管）
    closeSupportPanel();
    document.body.classList.add('meditating');
    document.body.classList.remove('ui-visible');
    clearTimeout(hideTimer);

    // 5.2 短暂停顿后，呼吸气泡缓缓浮现，强化仪式感
    setTimeout(function(){
      meditationLayer.classList.add('active');
      startBreathCycle();
    }, 650);

    countdownTimer = setInterval(function(){
      remainingSeconds--;
      updateCountdownDisplay();
      if (remainingSeconds <= 0){
        endMeditation();
      }
    }, 1000);
  }

  function startBreathCycle(){
    var inhale = true;
    breathText.textContent = '吸气...';
    breathText.style.opacity = '1';

    breathTextTimer = setInterval(function(){
      inhale = !inhale;
      breathText.style.opacity = '0';
      setTimeout(function(){
        if (inhale){
          breathText.textContent = '吸气...';
        } else {
          breathText.textContent = Math.random() > 0.5 ? '呼气...' : '释怀...';
        }
        breathText.style.opacity = '1';
      }, 300);
    }, 4000);
  }

  function updateCountdownDisplay(){
    var m = Math.floor(remainingSeconds / 60);
    var s = remainingSeconds % 60;
    breathCountdown.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ============================================================
  // 6. 优雅退出：倒计时结束 / Esc / 手机双击
  // ============================================================
  function endMeditation(){
    clearInterval(countdownTimer);
    clearInterval(breathTextTimer);
    countdownTimer = null;
    breathTextTimer = null;

    meditationLayer.classList.remove('active');

    setTimeout(function(){
      document.body.classList.remove('meditating');
      selectedMinutes = null;
      durationBtns.forEach(function(b){ b.classList.remove('selected'); });
      startBtn.classList.remove('enabled');
      wake(); // 解冻并重新激活鼠标静止淡出监听，无缝回到隐形状态
    }, 1200);
  }

  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.body.classList.contains('meditating')){
      endMeditation();
    }
  });

  var lastTap = 0;
  meditationLayer.addEventListener('touchend', function(){
    var now = Date.now();
    if (now - lastTap < 350 && document.body.classList.contains('meditating')){
      endMeditation();
    }
    lastTap = now;
  });

})();
</script>

</body>
</html>
