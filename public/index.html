<style>
  :root{
    --ease-slow: cubic-bezier(0.22, 1, 0.36, 1);
    --ui-fade-in: 1.1s;
    --ui-fade-out: 1.8s;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    width:100%; height:100%;
    overflow:hidden;
    /* 即使图片加载失败，也不会是死气沉沉的纯黑，而是一层有呼吸感的夜色渐变 */
    background: radial-gradient(ellipse at 50% 40%, #1b212c 0%, #0a0c10 65%, #050608 100%);
    font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    cursor: default;
  }

  /* ============ 背景层：两张图交叉淡入淡出 ============ */
  /* 满铺裁切方案：直接把元素框定为 100vw × 100vh，再用 object-fit: cover 裁切，
     不管素材原始分辨率或宽高比是多少都能正确居中裁切满屏。
     （注：早期用过 min-width/min-height:100% + width/height:auto 的老技巧，
     这套写法在源素材宽高比与屏幕差异较大时会把框撑得远大于视口，叠加
     object-fit:cover 后只截取到其中一角，现已改用更稳健的写法；
     背景本身也已经从 <video> 全部换成 <img>，不再需要处理视频解码/
     缓冲相关的一整套复杂逻辑，这是全站目前最大的一次简化） */

  .bg-layer{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    pointer-events:none;      /* 关键防干扰：彻底禁止对背景的任何点击/长按交互 */
    user-select:none;
    background:#000;
    z-index:0;
    opacity:0;
    transition: opacity 0.3s ease;
  }
  .bg-layer.active{
    opacity:1;
    z-index:1;    /* 正在显示的那张图叠在上面，避免两张都 opacity:0 时露出中间的黑底 */
  }

  /* 夜间遮罩滤镜层：压暗画面，保证悬浮文字清晰可读
     注意：这里没有用 backdrop-filter，是历史遗留——以前背景是 <video> 时，
     backdrop-filter 在 Chromium 上采样视频背后画面有已知问题（视频常被提升到
     独立合成层，backdrop-filter 采样不到，导致整层渲染成纯黑）。
     现在背景已经全部改成图片，这个问题理论上不存在了，但纯色半透明叠加这个
     方案本身运行得很稳定，没必要为了“理论上更优雅”去动一个没问题的东西 */
  #bg-veil{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background: rgba(0,0,0,0.42);
  }

  /* 极轻的四角暗角，增加纵深与高级感 */
  #bg-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%);
  }

  /* ============ 界面总容器：负责统一呼吸式显隐 ============ */

  .ui-layer{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
  }

  .ui-fade{
    opacity:0;
    transition: opacity var(--ui-fade-out) var(--ease-slow);
    pointer-events:none;
  }
  body.ui-visible .ui-fade{
    opacity:1;
    transition: opacity var(--ui-fade-in) var(--ease-slow);
    pointer-events:auto;
  }

  /* ============ 左上角：品牌文案组 ============ */

  .brand{
    position:fixed;
    top:5.5vh;
    left:5.5vw;
    z-index:11;
    text-align:left;
    user-select:none;
  }

  .brand__title{
    font-family: 'Noto Sans SC', sans-serif;
    font-weight:300;
    font-size:1.2rem;
    letter-spacing:0.18em;
    color:rgba(255,255,255,0.92);
    text-shadow: 0 1px 12px rgba(0,0,0,0.35);
  }

  .brand__title .en{
    font-family: 'Cormorant Garamond', 'Noto Sans SC', serif;
    font-style: italic;
    font-weight:300;
    letter-spacing:0.06em;
    opacity:0.75;
    margin-left:0.5em;
    font-size:0.92em;
  }

  .brand__divider{
    display:block;
    width:22px;
    height:1px;
    background:rgba(255,255,255,0.4);
    margin:0.85em 0;
  }

  .brand__subtitle{
    font-weight:300;
    font-size:0.9rem;
    letter-spacing:0.12em;
    color:rgba(255,255,255,0.6);
  }

  /* ============ 右上角：地标小注 ============ */
  /* 切换场景时短暂浮现，几秒后自动隐去——不挂在 .ui-fade 上，
     是因为它有自己的、比鼠标静止隐形更短的独立节奏 */

  .landmark-caption{
    position:fixed;
    top:5.5vh;
    right:5.5vw;
    z-index:11;
    font-weight:300;
    font-size:0.72rem;
    letter-spacing:0.14em;
    color:rgba(255,255,255,0.55);
    text-align:right;
    text-shadow: 0 1px 10px rgba(0,0,0,0.35);
    opacity:0;
    pointer-events:none;
    transition: opacity 1.2s ease;
    max-width:40vw;
  }
  .landmark-caption.show{
    opacity:1;
  }

  /* ============ 下方正中：毛玻璃控制面板 ============ */

  .control-panel{
    position:fixed;
    left:50%;
    bottom:6vh;
    transform:translateX(-50%);
    z-index:11;
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px 14px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }

  .scene-btn{
    appearance:none;
    -webkit-appearance:none;
    border:0;
    background:transparent;
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    transition: background 0.5s ease, transform 0.4s ease;
  }

  .scene-btn:hover{
    background:rgba(255,255,255,0.09);
  }

  .scene-btn svg{
    width:18px;
    height:18px;
    stroke:rgba(255,255,255,0.62);
    stroke-width:1;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition: stroke 0.5s ease, opacity 0.5s ease;
  }

  .scene-btn.active{
    background:rgba(255,255,255,0.13);
  }
  .scene-btn.active svg{
    stroke:rgba(255,255,255,0.98);
  }

  .scene-btn__label{
    position:absolute;
    bottom:calc(100% + 10px);
    left:50%;
    transform:translateX(-50%) translateY(4px);
    white-space:nowrap;
    font-size:0.68rem;
    letter-spacing:0.15em;
    font-weight:300;
    color:rgba(255,255,255,0.85);
    background:rgba(0,0,0,0.4);
    padding:4px 10px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    backdrop-filter: blur(6px);
  }

  .scene-btn:hover .scene-btn__label{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .panel-divider{
    width:1px;
    height:18px;
    background:rgba(255,255,255,0.16);
    margin:0 2px;
  }

  /* ============ 支持我们 · 赞助/好物推荐气泡菜单 ============ */
  /* 默认不参与 3 秒静止隐形，仅在用户主动点开时出现 */

  .support-panel{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:250px;
    max-width:86vw;
    padding:18px 20px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:12px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .support-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }

  .support-panel__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
    text-align:center;
  }

  .support-panel__afdian{
    display:block;
    text-align:center;
    text-decoration:none;
    font-family:inherit;
    font-weight:300;
    font-size:0.8rem;
    letter-spacing:0.08em;
    color:rgba(255,255,255,0.92);
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:999px;
    padding:9px 18px;
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .support-panel__afdian:hover{
    background:rgba(255,255,255,0.18);
    border-color:rgba(255,255,255,0.6);
  }

  .support-panel__about{
    display:block;
    text-align:center;
    font-family:inherit;
    font-weight:300;
    font-size:0.68rem;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.4);
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.15);
    padding-bottom:1px;
    align-self:center;
    transition: color 0.4s ease, border-color 0.4s ease;
  }
  .support-panel__about:hover{
    color:rgba(255,255,255,0.75);
    border-color:rgba(255,255,255,0.5);
  }

  /* ============ 更多城市 · 展开面板 ============ */

  .more-cities-panel{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:230px;
    padding:16px 18px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .more-cities-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }

  .more-cities-panel__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
  }

  .more-cities-panel__list{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
  }

  .more-cities-panel__item{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.04);
    color:rgba(255,255,255,0.75);
    font-family:inherit;
    font-weight:300;
    font-size:0.75rem;
    letter-spacing:0.08em;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }
  .more-cities-panel__item:hover{
    border-color:rgba(255,255,255,0.45);
  }
  .more-cities-panel__item.active{
    background:rgba(255,255,255,0.85);
    color:rgba(10,10,10,0.85);
    border-color:rgba(255,255,255,0.85);
  }

  /* ============ 背景音乐开关图标 ============ */
  /* 默认显示“静音”图标；点开后切到“播放中”图标，两者互斥显示 */
  .scene-btn .icon-music-on{ display:none; }
  .scene-btn.active .icon-music-off{ display:none; }
  .scene-btn.active .icon-music-on{ display:block; }


  /* ============ 移动端适配 ============ */

  @media (max-width: 640px){
    .brand{ top:6.5vh; left:6vw; }
    .brand__title{ font-size:1.05rem; }
    .brand__subtitle{ font-size:0.78rem; }
    .landmark-caption{ top:6.5vh; right:6vw; font-size:0.66rem; max-width:48vw; }
    .control-panel{ bottom:5vh; padding:8px 10px; gap:2px; }
    .scene-btn{ width:38px; height:38px; }
    .scene-btn__label{ display:none; } /* 触屏无 hover，隐藏文字气泡 */
    .support-panel{ bottom:calc(5vh + 66px); min-width:210px; }
    .more-cities-panel{ bottom:calc(5vh + 66px); min-width:210px; }
  }

  /* 无障碍：尊重系统的“减少动态效果”偏好 */
  @media (prefers-reduced-motion: reduce){
    .ui-fade{ transition-duration: 0.2s !important; }
    .bg-layer{ transition-duration: 0.15s !important; }
  }
</style>

<body>

  <!-- ============ 背景层：两张图交叉淡入淡出 ============ -->
  <!-- 已彻底去掉视频，全站背景改用图片——图片早就全部预加载过，
       切换不再需要任何“等就绪”的逻辑，点了就是秒切 -->
  <img id="bg-image-1" class="bg-layer" alt="">
  <img id="bg-image-2" class="bg-layer" alt="">

  <!-- ============ 背景音乐（默认不自动播放，需用户手动点开）============ -->
  <!-- 两个 <audio> 交替使用，实现无缝交叉淡入淡出切歌，用法和背景图完全对称 -->
  <audio id="bg-audio-1" preload="none"></audio>
  <audio id="bg-audio-2" preload="none"></audio>

  <div id="bg-veil"></div>
  <div id="bg-vignette"></div>

  <!-- ============ 界面层 ============ -->
  <div class="ui-layer">

    <!-- 左上角品牌文案 -->
    <div class="brand ui-fade">
      <div class="brand__title">高楼之巅 <span class="en">gaolou.org</span></div>
      <span class="brand__divider"></span>
      <div class="brand__subtitle">登高，望远，然后释怀。</div>
    </div>

    <!-- 右上角地标小注：切换场景时短暂浮现，几秒后自动隐去，不受鼠标静止隐形逻辑控制 -->
    <div class="landmark-caption" id="landmarkCaption"></div>

      <div class="panel-divider"></div>

        <span class="scene-btn__label">更多城市</span>

      </button>

    </div>

  </div>

  <!-- ============ 更多城市 · 展开面板 ============ -->
  <!-- 直接复用之前生成的封面图（迪拜等 4 个之前已经确认过图片能正常访问），
       现在背景已经全部改用图片，这几个按钮不需要额外准备视频素材就能正常工作 -->
  <div class="more-cities-panel" id="moreCitiesPanel">
    <div class="more-cities-panel__label">更多城市</div>
    <div class="more-cities-panel__list">
      <button class="more-cities-panel__item" data-scene="dubai">迪拜</button>
      <button class="more-cities-panel__item" data-scene="newyork">纽约</button>
      <button class="more-cities-panel__item" data-scene="hongkong">香港</button>
      <button class="more-cities-panel__item" data-scene="tokyo">东京</button>
    </div>
  </div>

  <!-- ============ 支持我们 · 赞助气泡菜单 ============ -->
  <div class="support-panel" id="supportPanel">
    <div class="support-panel__label">留下一份心意</div>
    <a class="support-panel__afdian" href="https://afdian.com/a/zhengyi98" target="_blank" rel="noopener noreferrer">
      爱发电 · 请我们喝杯茶
    </a>
    <a class="support-panel__about" href="/about.html">关于「高楼之巅」</a>
  </div>

<script>
(function(){

  // ============================================================
  // 1. 场景配置 —— 每个场景可以挂若干张图片。
  //    第一次点某个分类按钮，显示这个分类的第 1 张；
  //    再点同一个按钮，换成第 2 张，依次循环——
  //    比如“魔幻重庆”连点两次，就是“重庆一 → 重庆二”。
  //    素材库大小完全灵活，往数组里加/删链接即可，不用碰下面的逻辑代码
  // ============================================================
  var SCENES = {
    chongqing: {
      name:'魔幻重庆',
      images:[
        { src:'/videos/chongqing-1.jpg', landmark:'重庆来福士（朝天扬帆） · 354.5米' },
        { src:'/videos/chongqing-2.jpg', landmark:'重庆环球金融中心 · 338.9米' },
        { src:'/videos/chongqing-3.jpg', landmark:'九龙仓国际金融中心 · 316.3米' },
        { src:'/videos/chongqing-4.jpg', landmark:'天和国际中心 · 301.75米' }
      ]
    },
    shanghai: {
      name:'都市上海',
      images:[
        { src:'/videos/shanghai-1.jpg', landmark:'上海中心大厦 · 632米' },
        { src:'/videos/shanghai-2.jpg', landmark:'上海环球金融中心 · 492米' },
        { src:'/videos/shanghai-3.jpg', landmark:'金茂大厦 · 420.5米' },
        { src:'/videos/shanghai-4.jpg', landmark:'东方明珠塔 · 468米' }
      ]
    },
    snowmountain: {
      name:'治愈雪山',
      images:[
        { src:'/videos/snowmountain-1.jpg', landmark:'珠穆朗玛峰 · 8848.86米（亚洲最高峰）' },
        { src:'/videos/snowmountain-2.jpg', landmark:'阿空加瓜峰 · 6961米（南美洲最高峰）' },
        { src:'/videos/snowmountain-3.jpg', landmark:'迪纳利峰 · 6190米（北美洲最高峰）' },
        { src:'/videos/snowmountain-4.jpg', landmark:'乞力马扎罗山 · 5895米（非洲最高峰）' }
        // 七大洲最高峰还剩：厄尔布鲁士峰 5642米（欧洲）、文森峰 4892米（南极洲）、
        // 查亚峰 4884米（大洋洲）——想凑齐一整套，往上加条目即可
      ]
    },

    // ============================================================
    // “更多城市”——控制面板放不下更多图标了，这几个放进单独的展开面板。
    // 这几张封面图之前生成视频海报时其实已经传上去了，直接复用，不用额外准备素材
    // ============================================================
    dubai: {
      name:'迪拜',
      images:[
        { src:'/videos/dubai-1.jpg', landmark:'哈利法塔 · 828米（世界最高建筑）' }
      ]
    },
    newyork: {
      name:'纽约',
      images:[
        { src:'/videos/newyork-1.jpg', landmark:'世界贸易中心一号楼 · 541米' }
      ]
    },
    hongkong: {
      name:'香港',
      images:[
        { src:'/videos/hongkong-1.jpg', landmark:'环球贸易广场（ICC） · 484米' }
      ]
    },
    tokyo: {
      name:'东京',
      images:[
        { src:'/videos/tokyo-1.jpg', landmark:'麻布台之丘森大厦 · 325米' }
      ]
    }
  };
  var SCENE_KEYS = Object.keys(SCENES);
  var MAIN_SCENE_KEYS = ['chongqing', 'shanghai', 'snowmountain']; // 控制面板上常驻的 3 个
  var EXTRA_SCENE_KEYS = ['dubai', 'newyork', 'hongkong', 'tokyo'];             // 收进“更多城市”面板的

  // 全部分类、全部图片，页面一打开就立刻全量预加载——图片体积小，
  // 这一步做完之后，不管用户先点哪个按钮，画面都是秒切
  function preloadAllImages(){
    SCENE_KEYS.forEach(function(key){
      var list = SCENES[key] && SCENES[key].images;
      if (!list) return;
      list.forEach(function(entry){
        var img = new Image();
        img.src = entry.src; // 加载失败也静默无害
      });
    });
  }
  preloadAllImages();

  // 两张 <img> 交替使用，实现无缝交叉淡入淡出，用法和背景音乐完全对称
  var bgImages = [document.getElementById('bg-image-1'), document.getElementById('bg-image-2')];
  var activeImageIndex = 0;
  // 用统一的 [data-scene] 选择器，这样控制面板上的 4 个常驻按钮，
  // 和“更多城市”展开面板里的按钮，可以共用同一套点击/高亮逻辑
  var sceneButtons = document.querySelectorAll('[data-scene]');
  var landmarkCaption = document.getElementById('landmarkCaption');

  var currentSceneKey = null;
  var currentImageIndex = {}; // 记住每个分类目前放到第几张了，方便“再点一次换下一张”
  var landmarkTimer = null;

  function showLandmarkCaption(text){
    clearTimeout(landmarkTimer);
    if (!text){
      landmarkCaption.classList.remove('show');
      return;
    }
    landmarkCaption.textContent = text;
    landmarkCaption.classList.add('show');
    landmarkTimer = setTimeout(function(){
      landmarkCaption.classList.remove('show');
    }, 3500);
  }

  bgImages.forEach(function(img){
    img.addEventListener('error', function(){
      console.error(
        '[高楼之巅] 背景图加载失败：' + img.src +
        '\n请确认文件已放进 public/videos/ 目录，且路径与真实文件名完全一致。'
      );
    });
  });

  // ============================================================
  // 2. 点击即切换：图片早就预加载过，直接换 src、做个交叉淡入淡出即可——
  //    换成图片之后不再需要任何“等就绪”的逻辑，这是这次简化最大的收益
  // ============================================================
  function selectScene(key){
    var list = SCENES[key] && SCENES[key].images;
    if (!list || !list.length) return;

    var idx;
    if (key === currentSceneKey && list.length > 1){
      idx = ((currentImageIndex[key] || 0) + 1) % list.length; // 同一个分类再点一次，换下一张
    } else {
      idx = currentImageIndex[key] || 0;
    }
    currentImageIndex[key] = idx;
    currentSceneKey = key;

    var entry = list[idx];
    showLandmarkCaption(entry.landmark); // 每一张图有自己的小注

    var activeImg  = bgImages[activeImageIndex];
    var nextIndex  = 1 - activeImageIndex;
    var nextImg    = bgImages[nextIndex];

    nextImg.src = entry.src; // 早就预加载过，这一步几乎瞬时
    nextImg.classList.add('active');
    activeImg.classList.remove('active');
    activeImageIndex = nextIndex;

    sceneButtons.forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.scene === key);
    });
  }

  sceneButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      selectScene(btn.dataset.scene);
    });
  });

  // 进站默认画面固定用一张专门设计的静态图（融合城市与雪山两个主题），
  // 不随机挑某个分类的封面——进站第一眼保持稳定、可预期，
  // “随机”这件事留给用户自己点按钮去体验就好
  (function showDefaultImage(){
    var img = bgImages[activeImageIndex];
    img.src = '/hero-cover.jpg';
    img.classList.add('active');
    currentSceneKey = null; // 还没真正“选中”任何分类，保留 null，方便第一次点击时从第 1 张开始
  })();

  // ============================================================
  // 3. 智能隐形逻辑（鼠标静止 3 秒自动隐藏）
  // ============================================================
  var hideTimer = null;
  var HIDE_DELAY = 3000;

  function wake(){
    // 冥想模式下彻底冻结此逻辑：无论怎样移动鼠标，界面都绝不重新出现
    if (document.body.classList.contains('meditating')) return;

    document.body.classList.add('ui-visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
      document.body.classList.remove('ui-visible');
    }, HIDE_DELAY);
  }

  ['mousemove', 'mousedown', 'touchstart', 'touchmove', 'keydown', 'wheel'].forEach(function(evt){
    window.addEventListener(evt, wake, { passive:true });
  });

  wake();

  window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // ============================================================
  // 背景音乐：跟背景图一样支持“素材库 + 随机播放”，用双 <audio> 交叉淡入淡出
  // 实现无缝切歌，一首快放完时提前切下一首，不会有静音空隙。
  // 默认不自动播放（浏览器策略也不允许带声音的音频自动播放），需要用户主动点开。
  // 曲库大小完全灵活，往数组里加/删链接即可
  // ============================================================
  var AUDIO_TRACKS = [
    '/audio/ambient-1.mp3',
    '/audio/ambient-2.mp3',
    '/audio/ambient-3.mp3'
    // 继续往下加即可
  ];
  var CROSSFADE_SECONDS = 2.5;
  var TARGET_VOLUME = 0.35;

  var audios = [document.getElementById('bg-audio-1'), document.getElementById('bg-audio-2')];
  var activeAudioIndex = 0;
  var lastAudioTrack = null;
  var musicBtn = document.getElementById('musicBtn');
  var musicOn  = false;

  function pickTrack(){
    if (!AUDIO_TRACKS.length) return null;
    if (AUDIO_TRACKS.length === 1) return AUDIO_TRACKS[0];
    var idx;
    do {
      idx = Math.floor(Math.random() * AUDIO_TRACKS.length);
    } while (AUDIO_TRACKS[idx] === lastAudioTrack);
    lastAudioTrack = AUDIO_TRACKS[idx];
    return AUDIO_TRACKS[idx];
  }

  function fadeVolume(el, from, to, duration, done){
    var start = null;
    function step(ts){
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / duration);
      el.volume = from + (to - from) * p;
      if (p < 1){
        requestAnimationFrame(step);
      } else if (done){
        done();
      }
    }
    requestAnimationFrame(step);
  }

  // 监听当前播放曲目的剩余时间，快放完时提前触发交叉切歌，避免留白静音
  function watchForCrossfade(el){
    function onTimeUpdate(){
      if (!musicOn){ return; }
      if (el.duration && (el.duration - el.currentTime) <= CROSSFADE_SECONDS){
        el.removeEventListener('timeupdate', onTimeUpdate);
        crossfadeToNextTrack();
      }
    }
    el.addEventListener('timeupdate', onTimeUpdate);
  }

  function crossfadeToNextTrack(){
    if (!musicOn) return;
    var current    = audios[activeAudioIndex];
    var nextIndex  = 1 - activeAudioIndex;
    var next       = audios[nextIndex];
    var track      = pickTrack();
    if (!track) return;

    next.src = track;
    next.load();
    next.addEventListener('canplay', function onReady(){
      next.removeEventListener('canplay', onReady);
      next.volume = 0;
      var p = next.play();
      if (p && p.catch){ p.catch(function(err){ console.warn('[高楼之巅] 背景音乐播放失败：', err); }); }
      fadeVolume(next, 0, TARGET_VOLUME, CROSSFADE_SECONDS * 1000);
      fadeVolume(current, current.volume, 0, CROSSFADE_SECONDS * 1000, function(){ current.pause(); });
      activeAudioIndex = nextIndex;
      watchForCrossfade(next);
    }, { once:true });
  }

  musicBtn.addEventListener('click', function(){
    musicOn = !musicOn;
    musicBtn.classList.toggle('active', musicOn);

    if (musicOn){
      var el = audios[activeAudioIndex];
      var track = pickTrack();
      if (!track) return;
      el.src = track;
      el.load();
      el.addEventListener('canplay', function onReady(){
        el.removeEventListener('canplay', onReady);
        el.volume = 0;
        var p = el.play();
        if (p && p.catch){ p.catch(function(err){ console.warn('[高楼之巅] 背景音乐播放被浏览器拦截或失败：', err); }); }
        fadeVolume(el, 0, TARGET_VOLUME, 1200);
        watchForCrossfade(el);
      }, { once:true });
      // 注：不再额外预取曲库其余曲目——crossfade 机制本身会在当前曲目
      // 播放到剩 2.5 秒时就提前去加载下一首，这个提前量已经够用，
      // 不需要再单独起一套预取逻辑
    } else {
      var current = audios[activeAudioIndex];
      fadeVolume(current, current.volume, 0, 800, function(){
        audios.forEach(function(a){ a.pause(); });
      });
    }
  });

  audios.forEach(function(a){
    a.addEventListener('error', function(){
      console.error(
        '[高楼之巅] 背景音乐加载失败：' + (a.currentSrc || a.src) +
        '\n请确认音频文件已放进 public/audio/ 目录，且代码里 AUDIO_TRACKS 里的路径与真实文件名完全一致。'
      );
    });
  });

  // ============================================================
  // 4. 支持我们 —— 赞助气泡菜单 ｜ 更多城市 —— 展开面板
  //    两个气泡菜单共用同一套“互斥展开、点外部收起”的逻辑。
  //    “云上发呆”从这里搬到了独立页面 meditate.html——
  //    呼吸/沉思那一整套逻辑体量太大、迭代也最频繁，拆出去之后
  //    以后调它不会再有牵连到这里场景切换的风险
  // ============================================================
  var meditateBtn   = document.getElementById('meditateBtn');

  var supportBtn    = document.getElementById('supportBtn');
  var supportPanel  = document.getElementById('supportPanel');

  var moreCitiesBtn   = document.getElementById('moreCitiesBtn');
  var moreCitiesPanel = document.getElementById('moreCitiesPanel');
  var moreCitiesItems = document.querySelectorAll('.more-cities-panel__item');

  function closeSupportPanel(){
    supportPanel.classList.remove('open');
    supportBtn.classList.remove('active');
  }
  function closeMoreCities(){
    moreCitiesPanel.classList.remove('open');
    moreCitiesBtn.classList.remove('active');
  }

  // 跳转前把当前正在看的这张背景图带过去，冥想页打开时画面能无缝接上，
  // 不会突然换成一张陌生的图
  meditateBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var currentSrc = bgImages[activeImageIndex].src;
    window.location.href = '/meditate.html?bg=' + encodeURIComponent(currentSrc);
  });

  supportBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willOpen = !supportPanel.classList.contains('open');
    closeMoreCities();
    supportPanel.classList.toggle('open', willOpen);
    supportBtn.classList.toggle('active', willOpen);
  });

  moreCitiesBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willOpen = !moreCitiesPanel.classList.contains('open');
    closeSupportPanel();
    moreCitiesPanel.classList.toggle('open', willOpen);
    moreCitiesBtn.classList.toggle('active', willOpen);
  });

  // 面板里的城市按钮本身已经通过通用的 [data-scene] 点击监听调用了 selectScene，
  // 这里只需要额外补一句：选完之后把这个展开面板收起来
  moreCitiesItems.forEach(function(btn){
    btn.addEventListener('click', function(){
      closeMoreCities();
    });
  });

  // 点击任一气泡菜单以外的区域，优雅收起（两个菜单共用这一套判断）
  document.addEventListener('click', function(e){
    if (supportPanel.classList.contains('open') &&
        !supportPanel.contains(e.target) &&
        !supportBtn.contains(e.target)){
      closeSupportPanel();
    }
    if (moreCitiesPanel.classList.contains('open') &&
        !moreCitiesPanel.contains(e.target) &&
        !moreCitiesBtn.contains(e.target)){
      closeMoreCities();
    }
  });

})();
</script>
