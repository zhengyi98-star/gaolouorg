<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>高楼之巅 | gaolou.org</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

<style>
  :root{
    --ease-slow: cubic-bezier(0.22, 1, 0.36, 1);
    --ui-fade-in: 1.1s;
    --ui-fade-out: 1.8s;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    width:100%; height:100%;
    overflow:hidden;
    /* 即使视频加载失败，也不会是死气沉沉的纯黑，而是一层有呼吸感的夜色渐变 */
    background: radial-gradient(ellipse at 50% 40%, #1b212c 0%, #0a0c10 65%, #050608 100%);
    font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    cursor: default;
  }

  /* ============ 原生 <video> 背景层 ============ */
  /* 满铺裁切方案：直接把视频框定为 100vw × 100vh，再用 object-fit: cover 裁切，
     不管视频原始分辨率或宽高比是多少都能正确居中裁切满屏。
     （注：之前用的是 min-width/min-height:100% + width/height:auto 的老技巧，
     这套写法在源视频宽高比与屏幕差异较大、尤其是高分辨率素材时，
     会把视频框撑得远大于视口，叠加 object-fit:cover 后只截取到其中一角，
     这正是“视频显示不全、只看到一个角落”的根因，现已彻底改用更稳健的写法） */

  /* ============ 背景层：常驻图 + 按需视频 ============ */
  /* 满铺裁切方案：直接把元素框定为 100vw × 100vh，再用 object-fit: cover 裁切，
     不管素材原始分辨率或宽高比是多少都能正确居中裁切满屏。
     （注：之前用的是 min-width/min-height:100% + width/height:auto 的老技巧，
     这套写法在源素材宽高比与屏幕差异较大、尤其是高分辨率素材时，
     会把框撑得远大于视口，叠加 object-fit:cover 后只截取到其中一角，
     这正是“画面显示不全、只看到一个角落”的根因，现已彻底改用更稳健的写法） */

  .bg-layer{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    pointer-events:none;      /* 关键防干扰：彻底禁止对背景的任何点击/长按交互 */
    user-select:none;
    background:#000;
  }

  #bg-image{
    z-index:0;    /* 图片永远在最底层、永远可见，负责“进站瞬间不卡顿”和视频加载期间兜底 */
  }

  #bg-video{
    z-index:1;    /* 叠在图片上方，只有加载好、淡入之后才会盖住图片 */
    opacity:0;
    transition: opacity 1.2s ease;
  }
  #bg-video.active{
    opacity:1;
  }

  /* 夜间遮罩滤镜层：压暗视频，保证悬浮文字清晰可读
     注意：这里刻意不用 backdrop-filter —— 它在采样 <video> 元素背后画面时
     在 Chromium 上有已知问题（视频常被提升到独立合成层，backdrop-filter 采样不到，
     导致整层渲染成纯黑），改用纯色半透明叠加来压暗，效果一致且稳定可靠 */
  #bg-veil{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background: rgba(0,0,0,0.42);
  }

  /* 极轻的四角暗角，增加纵深与高级感 */
  #bg-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%);
  }

  /* ============ 界面总容器：负责统一呼吸式显隐 ============ */

  .ui-layer{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
  }

  .ui-fade{
    opacity:0;
    transition: opacity var(--ui-fade-out) var(--ease-slow);
    pointer-events:none;
  }
  body.ui-visible .ui-fade{
    opacity:1;
    transition: opacity var(--ui-fade-in) var(--ease-slow);
    pointer-events:auto;
  }

  /* 冥想模式：强制在 1 秒内彻底隐藏主界面，且无论鼠标如何移动都不再唤醒 */
  body.meditating .ui-fade{
    opacity:0 !important;
    pointer-events:none !important;
    transition: opacity 1s var(--ease-slow) !important;
  }
  body.meditating{
    cursor:none;
  }

  /* ============ 左上角：品牌文案组 ============ */

  .brand{
    position:fixed;
    top:5.5vh;
    left:5.5vw;
    z-index:11;
    text-align:left;
    user-select:none;
  }

  .brand__title{
    font-family: 'Noto Sans SC', sans-serif;
    font-weight:300;
    font-size:1.2rem;
    letter-spacing:0.18em;
    color:rgba(255,255,255,0.92);
    text-shadow: 0 1px 12px rgba(0,0,0,0.35);
  }

  .brand__title .en{
    font-family: 'Cormorant Garamond', 'Noto Sans SC', serif;
    font-style: italic;
    font-weight:300;
    letter-spacing:0.06em;
    opacity:0.75;
    margin-left:0.5em;
    font-size:0.92em;
  }

  .brand__divider{
    display:block;
    width:22px;
    height:1px;
    background:rgba(255,255,255,0.4);
    margin:0.85em 0;
  }

  .brand__subtitle{
    font-weight:300;
    font-size:0.9rem;
    letter-spacing:0.12em;
    color:rgba(255,255,255,0.6);
  }

  /* ============ 右上角：地标小注 ============ */
  /* 切换场景时短暂浮现，几秒后自动隐去——不挂在 .ui-fade 上，
     是因为它有自己的、比鼠标静止隐形更短的独立节奏 */

  .landmark-caption{
    position:fixed;
    top:5.5vh;
    right:5.5vw;
    z-index:11;
    font-weight:300;
    font-size:0.72rem;
    letter-spacing:0.14em;
    color:rgba(255,255,255,0.55);
    text-align:right;
    text-shadow: 0 1px 10px rgba(0,0,0,0.35);
    opacity:0;
    pointer-events:none;
    transition: opacity 1.2s ease;
    max-width:40vw;
  }
  .landmark-caption.show{
    opacity:1;
  }

  /* ============ 下方正中：毛玻璃控制面板 ============ */

  .control-panel{
    position:fixed;
    left:50%;
    bottom:6vh;
    transform:translateX(-50%);
    z-index:11;
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px 14px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }

  .scene-btn{
    appearance:none;
    -webkit-appearance:none;
    border:0;
    background:transparent;
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    transition: background 0.5s ease, transform 0.4s ease;
  }

  .scene-btn:hover{
    background:rgba(255,255,255,0.09);
  }

  .scene-btn svg{
    width:18px;
    height:18px;
    stroke:rgba(255,255,255,0.62);
    stroke-width:1;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition: stroke 0.5s ease, opacity 0.5s ease;
  }

  .scene-btn.active{
    background:rgba(255,255,255,0.13);
  }
  .scene-btn.active svg{
    stroke:rgba(255,255,255,0.98);
  }

  .scene-btn__label{
    position:absolute;
    bottom:calc(100% + 10px);
    left:50%;
    transform:translateX(-50%) translateY(4px);
    white-space:nowrap;
    font-size:0.68rem;
    letter-spacing:0.15em;
    font-weight:300;
    color:rgba(255,255,255,0.85);
    background:rgba(0,0,0,0.4);
    padding:4px 10px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    backdrop-filter: blur(6px);
  }

  .scene-btn:hover .scene-btn__label{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .panel-divider{
    width:1px;
    height:18px;
    background:rgba(255,255,255,0.16);
    margin:0 2px;
  }

  /* ============ 冥想时长气泡菜单 ============ */

  .time-picker{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:230px;
    padding:16px 18px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .time-picker.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  body.meditating .time-picker{
    opacity:0 !important;
    pointer-events:none !important;
  }

  /* ============ 支持我们 · 赞助/好物推荐气泡菜单 ============ */
  /* 与 .time-picker 同一套毛玻璃语言，保持视觉统一；默认不参与 3 秒静止隐形，
     仅在用户主动点开时出现，关闭方式与冥想时长菜单完全一致 */

  .support-panel{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:250px;
    max-width:86vw;
    padding:18px 20px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:12px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .support-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  body.meditating .support-panel{
    opacity:0 !important;
    pointer-events:none !important;
  }

  .support-panel__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
    text-align:center;
  }

  .support-panel__afdian{
    display:block;
    text-align:center;
    text-decoration:none;
    font-family:inherit;
    font-weight:300;
    font-size:0.8rem;
    letter-spacing:0.08em;
    color:rgba(255,255,255,0.92);
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:999px;
    padding:9px 18px;
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .support-panel__afdian:hover{
    background:rgba(255,255,255,0.18);
    border-color:rgba(255,255,255,0.6);
  }

  .support-panel__about{
    display:block;
    text-align:center;
    font-family:inherit;
    font-weight:300;
    font-size:0.68rem;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.4);
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.15);
    padding-bottom:1px;
    align-self:center;
    transition: color 0.4s ease, border-color 0.4s ease;
  }
  .support-panel__about:hover{
    color:rgba(255,255,255,0.75);
    border-color:rgba(255,255,255,0.5);
  }

  /* ============ 更多城市 · 展开面板 ============ */

  .more-cities-panel{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:230px;
    padding:16px 18px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .more-cities-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  body.meditating .more-cities-panel{
    opacity:0 !important;
    pointer-events:none !important;
  }

  .more-cities-panel__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
  }

  .more-cities-panel__list{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
  }

  .more-cities-panel__item{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.04);
    color:rgba(255,255,255,0.75);
    font-family:inherit;
    font-weight:300;
    font-size:0.75rem;
    letter-spacing:0.08em;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }
  .more-cities-panel__item:hover{
    border-color:rgba(255,255,255,0.45);
  }
  .more-cities-panel__item.active{
    background:rgba(255,255,255,0.85);
    color:rgba(10,10,10,0.85);
    border-color:rgba(255,255,255,0.85);
  }

  /* ============ 背景音乐开关图标 ============ */
  /* 默认显示“静音”图标；点开后切到“播放中”图标，两者互斥显示 */
  .scene-btn .icon-music-on{ display:none; }
  .scene-btn.active .icon-music-off{ display:none; }
  .scene-btn.active .icon-music-on{ display:block; }

  .time-picker__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
  }

  .time-picker__options{
    display:flex;
    gap:8px;
  }

  .time-picker__option{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.04);
    color:rgba(255,255,255,0.75);
    font-family:inherit;
    font-weight:300;
    font-size:0.75rem;
    letter-spacing:0.08em;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }

  .time-picker__option:hover{
    border-color:rgba(255,255,255,0.45);
  }

  .time-picker__option.selected{
    background:rgba(255,255,255,0.85);
    color:rgba(10,10,10,0.85);
    border-color:rgba(255,255,255,0.85);
  }

  .time-picker__start{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.3);
    background:transparent;
    color:rgba(255,255,255,0.35);
    font-family:inherit;
    font-weight:300;
    font-size:0.78rem;
    letter-spacing:0.25em;
    padding:8px 26px;
    border-radius:999px;
    cursor:not-allowed;
    transition: all 0.4s ease;
  }

  .time-picker__start.enabled{
    color:rgba(255,255,255,0.95);
    border-color:rgba(255,255,255,0.7);
    cursor:pointer;
  }
  .time-picker__start.enabled:hover{
    background:rgba(255,255,255,0.12);
  }

  /* ============ 中央呼吸冥想气泡（Pixel Thoughts 致敬）============ */

  .meditation-layer{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:32px;
    opacity:0;
    pointer-events:none;
    transition: opacity 1.4s var(--ease-slow);
  }
  .meditation-layer.active{
    opacity:1;
    pointer-events:auto;
  }

  .breath-bubble{
    width:80px;
    height:80px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 35% 32%, rgba(255,255,255,0.4), rgba(255,255,255,0.05) 72%);
    border:1px solid rgba(255,255,255,0.4);
    animation-name: breathe;
    animation-iteration-count: infinite;
    animation-duration: 8s;   /* JS 会按用户调节的速率实时改写这个值 */
    will-change: transform, box-shadow;
  }

  /* 呼吸节奏做成不对称的：吸气（0%→42%）稍快，是主动的肌肉收缩；
     呼气（42%→100%）更长更缓，是被动的弹性回缩——
     这跟人真实呼吸时“吸气用力、呼气放松”的力学特征是一致的，
     配合每个关键帧各自的 easing，让扩张收缩的加减速也更接近有机的肺部运动，
     而不是机械对称的正弦波 */
  @keyframes breathe{
    0%   { transform:scale(1);    box-shadow:0 0 20px 4px rgba(255,255,255,0.14), 0 0 46px 14px rgba(255,255,255,0.05); animation-timing-function: cubic-bezier(0.45, 0, 0.4, 1); }
    42%  { transform:scale(1.85); box-shadow:0 0 60px 20px rgba(255,255,255,0.32), 0 0 120px 36px rgba(255,255,255,0.12); animation-timing-function: cubic-bezier(0.55, 0, 0.35, 1); }
    100% { transform:scale(1);    box-shadow:0 0 20px 4px rgba(255,255,255,0.14), 0 0 46px 14px rgba(255,255,255,0.05); }
  }

  .breath-bubble__text{
    font-weight:300;
    font-size:0.78rem;
    letter-spacing:0.15em;
    color:rgba(255,255,255,0.88);
    transition: opacity 0.6s ease;
    white-space:nowrap;
  }

  .breath-countdown{
    font-weight:300;
    font-size:0.72rem;
    letter-spacing:0.22em;
    color:rgba(255,255,255,0.38);
    font-variant-numeric: tabular-nums;
  }

  /* ============ 呼吸节奏手动调节 ============ */

  .breath-rate{
    display:flex;
    align-items:center;
    gap:14px;
    opacity:0.55;
    transition: opacity 0.3s ease;
  }
  .breath-rate:hover{
    opacity:0.95;
  }

  .breath-rate__btn{
    appearance:none;
    -webkit-appearance:none;
    background:transparent;
    border:1px solid rgba(255,255,255,0.28);
    color:rgba(255,255,255,0.8);
    width:26px;
    height:26px;
    border-radius:50%;
    font-size:0.85rem;
    line-height:1;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background 0.35s ease, border-color 0.35s ease;
  }
  .breath-rate__btn:hover{
    background:rgba(255,255,255,0.14);
    border-color:rgba(255,255,255,0.55);
  }

  .breath-rate__value{
    font-size:0.62rem;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.5);
    font-variant-numeric: tabular-nums;
    min-width:84px;
    text-align:center;
  }

  /* ============ 破云见日 · 诗句 ============ */
  /* 倒计时自然结束时：气泡本体、倒计时、调速控件一起淡出，
     诗句在原来的位置浮现，停留片刻后随一切一起消失 */

  .meditation-layer.finale .breath-bubble,
  .meditation-layer.finale .breath-countdown,
  .meditation-layer.finale .breath-rate{
    opacity:0;

  @media (prefers-reduced-motion: reduce){

<body>

  <!-- 冥想开始瞬间，先浮现一句身体姿势的提示，隐去之后气泡才出现——
       把“登高”落到身体感受上，而不是做成打卡/连续天数这类游戏化的东西 -->

      <div class="breath-poem__author" id="poemAuthor"></div>
    </div>

    <div class="breath-hint">按 Esc 或双击屏幕，随时回到高楼之巅</div>
  </div>

<script>
(function(){

  // ============================================================
  // 1. 场景配置 —— 每个场景可以挂若干条视频。
  //    第一次点某个分类按钮，显示这个分类的第 1 条；
  //    再点同一个按钮，换成第 2 条，依次循环——
  //    比如“魔幻重庆”连点两次，就是“重庆一 → 重庆二”。
  //    素材库大小完全灵活，往数组里加/删链接即可，不用碰下面的逻辑代码
  // ============================================================
  var SCENES = {
    chongqing: {
      name:'魔幻重庆',
      videos:[
        { src:'/videos/chongqing-1.mp4', landmark:'重庆来福士（朝天扬帆） · 354.5米' },
        { src:'/videos/chongqing-2.mp4', landmark:'重庆环球金融中心 · 338.9米' },
        { src:'/videos/chongqing-3.mp4', landmark:'九龙仓国际金融中心 · 316.3米' },
        { src:'/videos/chongqing-4.mp4', landmark:'天和国际中心 · 301.75米' }
      ]
    },
    shanghai: {
      name:'都市上海',
      videos:[
        { src:'/videos/shanghai-1.mp4', landmark:'上海中心大厦 · 632米' },
        { src:'/videos/shanghai-2.mp4', landmark:'上海环球金融中心 · 492米' },
        { src:'/videos/shanghai-3.mp4', landmark:'金茂大厦 · 420.5米' },
        { src:'/videos/shanghai-4.mp4', landmark:'东方明珠塔 · 468米' }
      ]
    },
    snowmountain: {
      name:'治愈雪山',
      videos:[
        { src:'/videos/snowmountain-1.mp4', landmark:'珠穆朗玛峰 · 8848.86米（亚洲最高峰）' },
        { src:'/videos/snowmountain-2.mp4', landmark:'阿空加瓜峰 · 6961米（南美洲最高峰）' },
        { src:'/videos/snowmountain-3.mp4', landmark:'迪纳利峰 · 6190米（北美洲最高峰）' },
        { src:'/videos/snowmountain-4.mp4', landmark:'乞力马扎罗山 · 5895米（非洲最高峰）' }
        // 七大洲最高峰还剩：厄尔布鲁士峰 5642米（欧洲）、文森峰 4892米（南极洲）、
        // 查亚峰 4884米（大洋洲）——想凑齐一整套，往上加视频条目即可
      ]
    },
    cyberpunk: {
      name:'虚拟夜之城',
      videos:[
        { src:'/videos/cyberpunk-1.mp4', landmark:'' },
        { src:'/videos/cyberpunk-2.mp4', landmark:'' },
        { src:'/videos/cyberpunk-3.mp4', landmark:'' },
        { src:'/videos/cyberpunk-4.mp4', landmark:'' }
        // 虚构场景没有真实地标，想加氛围文字可以按自己的设定填，
        // 比如「新宿零区 · 388层」这种
      ]
    },

    // ============================================================
    // “更多城市”——控制面板放不下更多图标了，这几个放进单独的展开面板。
    // 目前是占位骨架：视频/封面文件还没有，先把结构和真实地标数据搭好，
    // 等你有素材了直接把 /videos/xxx.mp4 换成真实文件即可，逻辑不用碰
    // ============================================================
    dubai: {
      name:'迪拜',
      videos:[
        { src:'/videos/dubai-1.mp4', landmark:'哈利法塔 · 828米（世界最高建筑）' }
      ]
    },
    newyork: {
      name:'纽约',
      videos:[
        { src:'/videos/newyork-1.mp4', landmark:'世界贸易中心一号楼 · 541米' }
      ]
    },
    hongkong: {
      name:'香港',
      videos:[
        { src:'/videos/hongkong-1.mp4', landmark:'环球贸易广场（ICC） · 484米' }
      ]
    },
    tokyo: {
      name:'东京',
      videos:[
        { src:'/videos/tokyo-1.mp4', landmark:'麻布台之丘森大厦 · 325米' }
      ]
    }
  };
  var SCENE_KEYS = Object.keys(SCENES);
  var MAIN_SCENE_KEYS = ['chongqing', 'shanghai', 'snowmountain', 'cyberpunk']; // 控制面板上常驻的 4 个
  var EXTRA_SCENE_KEYS = ['dubai', 'newyork', 'hongkong', 'tokyo'];             // 收进“更多城市”面板的

  // 按“同名约定”推导海报图路径：/videos/chongqing-1.mp4 → /videos/chongqing-1.jpg
  function derivePosterPath(src){
    var m = src.match(/^(.*)\.[a-zA-Z0-9]+$/);
    return m ? (m[1] + '.jpg') : null;
  }

  // 全部分类、全部视频的海报图，页面一打开就立刻全量预加载——
  // 海报图体积极小（几十 KB 一张），这一步做完之后，不管用户先点哪个按钮，
  // 背景图都是秒切；真正的视频文件完全不预加载，只有点了才会去请求
  function preloadAllPosters(){
    SCENE_KEYS.forEach(function(key){
      var list = SCENES[key] && SCENES[key].videos;
      if (!list) return;
      list.forEach(function(entry){
        var posterPath = derivePosterPath(entry.src);
        if (!posterPath) return;
        var img = new Image();
        img.src = posterPath; // 加载失败也静默无害
      });
    });
  }
  preloadAllPosters();

  var bgImage = document.getElementById('bg-image');
  var bgVideo = document.getElementById('bg-video');
  // 用统一的 [data-scene] 选择器，这样控制面板上的 4 个常驻按钮，
  // 和“更多城市”展开面板里的按钮，可以共用同一套点击/高亮逻辑
  var sceneButtons = document.querySelectorAll('[data-scene]');
  var landmarkCaption = document.getElementById('landmarkCaption');

  var currentSceneKey = null;
  var currentVideoIndex = {}; // 记住每个分类目前放到第几条了，方便“再点一次换下一条”
  var switchGeneration = 0;   // 防止快速连点时，旧的一次切换在新的一次之后才完成而覆盖画面
  var landmarkTimer = null;

  function showLandmarkCaption(text){
    clearTimeout(landmarkTimer);
    if (!text){
      landmarkCaption.classList.remove('show');
      return;
    }
    landmarkCaption.textContent = text;
    landmarkCaption.classList.add('show');
    landmarkTimer = setTimeout(function(){
      landmarkCaption.classList.remove('show');
    }, 3500);
  }

  bgVideo.addEventListener('error', function(){
    console.error(
      '[高楼之巅] 背景视频加载失败：' + (bgVideo.currentSrc || bgVideo.src) +
      '\n常见原因：1) 视频源开启了防盗链（Referer 校验），需自建托管；' +
      '2) 链接失效或跨域被拒绝；3) 网络无法访问该域名。'
    );
  });

  // ============================================================
  // 2. 点击才加载：图片先秒切到位，视频这时候才真正开始请求，
  //    加载好之前，下面的图片全程兜底，不会有黑屏或闪烁
  // ============================================================
  function selectScene(key){
    var list = SCENES[key] && SCENES[key].videos;
    if (!list || !list.length) return;

    var idx;
    if (key === currentSceneKey && list.length > 1){
      idx = ((currentVideoIndex[key] || 0) + 1) % list.length; // 同一个分类再点一次，换下一条
    } else {
      idx = currentVideoIndex[key] || 0;
    }
    currentVideoIndex[key] = idx;
    currentSceneKey = key;

    var entry = list[idx];
    var posterPath = derivePosterPath(entry.src);
    var myGeneration = ++switchGeneration;

    if (posterPath){
      bgImage.src = posterPath; // 已经预加载过，这一步几乎瞬时
    }

    showLandmarkCaption(entry.landmark); // 每一条视频有自己的小注，不再是整个分类共用一句

    bgVideo.classList.remove('active'); // 先淡出旧视频，露出下面已经换好的图

    setTimeout(function(){
      if (myGeneration !== switchGeneration) return; // 切换过程中又点了别的，放弃这一次

      bgVideo.src = entry.src;
      bgVideo.load();

      function onReady(){
        bgVideo.removeEventListener('canplay', onReady);
        if (myGeneration !== switchGeneration) return;
        var p = bgVideo.play();
        if (p && p.catch){ p.catch(function(err){ console.warn('[高楼之巅] 视频播放被浏览器拦截或失败：', err); }); }
        bgVideo.classList.add('active');
      }
      bgVideo.addEventListener('canplay', onReady);
    }, 300); // 给旧视频的淡出动画留一点时间，避免瞬间跳变

    sceneButtons.forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.scene === key);
    });
  }

  sceneButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      selectScene(btn.dataset.scene);
    });
  });

  // 进站默认展示一个随机分类的封面图（不加载视频，视频等用户点了才开始）
  // 只从控制面板常驻的 4 个里挑，不用“更多城市”里那些还没配真实素材的占位分类
  (function showDefaultPoster(){
    var defaultKey = MAIN_SCENE_KEYS[Math.floor(Math.random() * MAIN_SCENE_KEYS.length)];
    var firstEntry = SCENES[defaultKey].videos[0];
    var posterPath = derivePosterPath(firstEntry.src);
    if (posterPath) bgImage.src = posterPath;
    sceneButtons.forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.scene === defaultKey);
    });
    currentSceneKey = null; // 还没真正“选中”任何分类的视频，保留 null，方便第一次点击时从第 1 条开始
  })();

  // ============================================================
  // 3. 智能隐形逻辑（鼠标静止 3 秒自动隐藏）
  // ============================================================
  var hideTimer = null;
  var HIDE_DELAY = 3000;

  function wake(){
    // 冥想模式下彻底冻结此逻辑：无论怎样移动鼠标，界面都绝不重新出现
    if (document.body.classList.contains('meditating')) return;

    document.body.classList.add('ui-visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
      document.body.classList.remove('ui-visible');
    }, HIDE_DELAY);
  }

  ['mousemove', 'mousedown', 'touchstart', 'touchmove', 'keydown', 'wheel'].forEach(function(evt){
    window.addEventListener(evt, wake, { passive:true });
  });

  wake();

  window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // ============================================================
  // 背景音乐：像视频一样支持“素材库 + 随机播放”，用双 <audio> 交叉淡入淡出
  // 实现无缝切歌，一首快放完时提前切下一首，不会有静音空隙。
  // 默认不自动播放（浏览器策略也不允许带声音的音频自动播放），需要用户主动点开。
  // 曲库大小完全灵活，往数组里加/删链接即可
  // ============================================================
  var AUDIO_TRACKS = [
    '/audio/ambient-1.mp3',
    '/audio/ambient-2.mp3',
    '/audio/ambient-3.mp3'
    // 继续往下加即可
  ];
  var CROSSFADE_SECONDS = 2.5;
  var TARGET_VOLUME = 0.35;

  var audios = [document.getElementById('bg-audio-1'), document.getElementById('bg-audio-2')];
  var activeAudioIndex = 0;
  var lastAudioTrack = null;
  var musicBtn = document.getElementById('musicBtn');
  var musicOn  = false;

  function pickTrack(){
    if (!AUDIO_TRACKS.length) return null;
    if (AUDIO_TRACKS.length === 1) return AUDIO_TRACKS[0];
    var idx;
    do {
      idx = Math.floor(Math.random() * AUDIO_TRACKS.length);
    } while (AUDIO_TRACKS[idx] === lastAudioTrack);
    lastAudioTrack = AUDIO_TRACKS[idx];
    return AUDIO_TRACKS[idx];
  }

  function fadeVolume(el, from, to, duration, done){
    var start = null;
    function step(ts){
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / duration);
      el.volume = from + (to - from) * p;
      if (p < 1){
        requestAnimationFrame(step);
      } else if (done){
        done();
      }
    }
    requestAnimationFrame(step);
  }

  // 监听当前播放曲目的剩余时间，快放完时提前触发交叉切歌，避免留白静音
  function watchForCrossfade(el){
    function onTimeUpdate(){
      if (!musicOn){ return; }
      if (el.duration && (el.duration - el.currentTime) <= CROSSFADE_SECONDS){
        el.removeEventListener('timeupdate', onTimeUpdate);
        crossfadeToNextTrack();
      }
    }
    el.addEventListener('timeupdate', onTimeUpdate);
  }

  function crossfadeToNextTrack(){
    if (!musicOn) return;
    var current    = audios[activeAudioIndex];
    var nextIndex  = 1 - activeAudioIndex;
    var next       = audios[nextIndex];
    var track      = pickTrack();
    if (!track) return;

    next.src = track;
    next.load();
    next.addEventListener('canplay', function onReady(){
      next.removeEventListener('canplay', onReady);
      next.volume = 0;
      var p = next.play();
      if (p && p.catch){ p.catch(function(err){ console.warn('[高楼之巅] 背景音乐播放失败：', err); }); }
      fadeVolume(next, 0, TARGET_VOLUME, CROSSFADE_SECONDS * 1000);
      fadeVolume(current, current.volume, 0, CROSSFADE_SECONDS * 1000, function(){ current.pause(); });
      activeAudioIndex = nextIndex;
      watchForCrossfade(next);
    }, { once:true });
  }

  musicBtn.addEventListener('click', function(){
    musicOn = !musicOn;
    musicBtn.classList.toggle('active', musicOn);

    if (musicOn){
      var el = audios[activeAudioIndex];
      var track = pickTrack();
      if (!track) return;
      el.src = track;
      el.load();
      el.addEventListener('canplay', function onReady(){
        el.removeEventListener('canplay', onReady);
        el.volume = 0;
        var p = el.play();
        if (p && p.catch){ p.catch(function(err){ console.warn('[高楼之巅] 背景音乐播放被浏览器拦截或失败：', err); }); }
        fadeVolume(el, 0, TARGET_VOLUME, 1200);
        watchForCrossfade(el);
      }, { once:true });
      // 注：不再额外预取曲库其余曲目——crossfade 机制本身会在当前曲目
      // 播放到剩 2.5 秒时就提前去加载下一首，这个提前量已经够用，
      // 不需要再单独起一套预取逻辑
    } else {
      var current = audios[activeAudioIndex];
      fadeVolume(current, current.volume, 0, 800, function(){
        audios.forEach(function(a){ a.pause(); });
      });
    }
  });

  audios.forEach(function(a){
    a.addEventListener('error', function(){
      console.error(
        '[高楼之巅] 背景音乐加载失败：' + (a.currentSrc || a.src) +
        '\n请确认音频文件已放进 public/audio/ 目录，且代码里 AUDIO_TRACKS 里的路径与真实文件名完全一致。'
      );
    });
  });

  // ============================================================
  // 4. 云上发呆 —— 时长选择气泡菜单 ｜ 支持我们 —— 赞助气泡菜单 ｜
  //    更多城市 —— 展开面板
  //    三个气泡菜单共用同一套“互斥展开、点外部收起”的逻辑
  // ============================================================
  var meditateBtn   = document.getElementById('meditateBtn');
  var timePicker    = document.getElementById('timePicker');
  var durationBtns  = document.querySelectorAll('.time-picker__option');
  var startBtn      = document.getElementById('startMeditation');

  var supportBtn    = document.getElementById('supportBtn');
  var supportPanel  = document.getElementById('supportPanel');

  var moreCitiesBtn   = document.getElementById('moreCitiesBtn');
  var moreCitiesPanel = document.getElementById('moreCitiesPanel');
  var moreCitiesItems = document.querySelectorAll('.more-cities-panel__item');

  var selectedMinutes = null;

  function closeTimePicker(){
    timePicker.classList.remove('open');
    meditateBtn.classList.remove('active');
  }
  function closeSupportPanel(){
    supportPanel.classList.remove('open');
    supportBtn.classList.remove('active');
  }
  function closeMoreCities(){
    moreCitiesPanel.classList.remove('open');
    moreCitiesBtn.classList.remove('active');
  }

  meditateBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willOpen = !timePicker.classList.contains('open');
    closeSupportPanel();
    closeMoreCities();
    timePicker.classList.toggle('open', willOpen);
    meditateBtn.classList.toggle('active', willOpen);
  });

  supportBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willOpen = !supportPanel.classList.contains('open');
    closeTimePicker();
    closeMoreCities();
    supportPanel.classList.toggle('open', willOpen);
    supportBtn.classList.toggle('active', willOpen);
  });

  moreCitiesBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willOpen = !moreCitiesPanel.classList.contains('open');
    closeTimePicker();
    closeSupportPanel();
    moreCitiesPanel.classList.toggle('open', willOpen);
    moreCitiesBtn.classList.toggle('active', willOpen);
  });

  // 面板里的城市按钮本身已经通过通用的 [data-scene] 点击监听调用了 selectScene，
  // 这里只需要额外补一句：选完之后把这个展开面板收起来
  moreCitiesItems.forEach(function(btn){
    btn.addEventListener('click', function(){
      closeMoreCities();
    });
  });

  durationBtns.forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      durationBtns.forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      selectedMinutes = parseInt(btn.dataset.min, 10);
      startBtn.classList.add('enabled');
    });
  });

  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (!selectedMinutes) return;
    closeTimePicker();
    startMeditation(selectedMinutes);
  });

  // 点击任一气泡菜单以外的区域，优雅收起（三个菜单共用这一套判断）
  document.addEventListener('click', function(e){
    if (timePicker.classList.contains('open') &&
        !timePicker.contains(e.target) &&
        !meditateBtn.contains(e.target)){
      closeTimePicker();
    }
    if (supportPanel.classList.contains('open') &&
        !supportPanel.contains(e.target) &&
        !supportBtn.contains(e.target)){
      closeSupportPanel();
    }
    if (moreCitiesPanel.classList.contains('open') &&
        !moreCitiesPanel.contains(e.target) &&
        !moreCitiesBtn.contains(e.target)){
      closeMoreCities();
    }
  });

  // ============================================================
  // 5. 进入冥想（开启精神留白）—— 呼吸引导气泡
  // ============================================================
  var meditationLayer = document.getElementById('meditationLayer');
  var meditationCue    = document.getElementById('meditationCue');
  var breathText       = document.getElementById('breathText');
  var breathBubble     = document.getElementById('breathBubble');
  var breathCountdown  = document.getElementById('breathCountdown');
  var rateSlowerBtn    = document.getElementById('rateSlower');
  var rateFasterBtn    = document.getElementById('rateFaster');
  var rateValueLabel   = document.getElementById('rateValue');

  var countdownTimer  = null;
  var breathPhaseTimer = null;
  var finaleTimer      = null;
  var remainingSeconds = 0;

  var breathPoem   = document.getElementById('breathPoem');
  var poemLine     = document.getElementById('poemLine');
  var poemAuthor   = document.getElementById('poemAuthor');

  // 诗句池：都扣“登高 / 望远 / 释怀”这个题，全部是公有领域的古典诗词
  var POEMS = [
    { line:'欲穷千里目，更上一层楼。', author:'王之涣 · 登鹳雀楼' },
    { line:'行到水穷处，坐看云起时。', author:'王维 · 终南别业' },
    { line:'起舞弄清影，何似在人间。', author:'苏轼 · 水调歌头' },
    { line:'相看两不厌，只有敬亭山。', author:'李白 · 独坐敬亭山' },
    { line:'不畏浮云遮望眼，只缘身在最高层。', author:'王安石 · 登飞来峰' },
    { line:'会当凌绝顶，一览众山小。', author:'杜甫 · 望岳' }
  ];
  var lastPoemIndex = null;

  function pickPoem(){
    if (POEMS.length === 1) return POEMS[0];
    var idx;
    do {
      idx = Math.floor(Math.random() * POEMS.length);
    } while (idx === lastPoemIndex);
    lastPoemIndex = idx;
    return POEMS[idx];
  }

  // 一次完整呼吸（吸气+呼气）的总时长，单位秒；吸气占 INHALE_RATIO，
  // 呼气占剩下的部分——呼气比吸气长，是刻意的：更长的呼气对应更放松的
  // 副交感神经反应，这也是"呼气...释怀..."想传达的感觉
  var breathPeriod  = 8;
  var INHALE_RATIO  = 0.42;
  var MIN_PERIOD    = 5;
  var MAX_PERIOD    = 14;

  function bpmLabel(period){
    return (60 / period).toFixed(1) + ' 次/分钟';
  }

  function applyBreathRate(){
    rateValueLabel.textContent = bpmLabel(breathPeriod);
    breathBubble.style.animationDuration = breathPeriod + 's';
  }

  // 让 CSS 里的 scale 动画从头重新开始播放，跟下面 JS 排的文字节奏对齐
  function restartBubbleAnimation(){
    breathBubble.style.animation = 'none';
    void breathBubble.offsetWidth; // 强制重排，这一行不能删
    breathBubble.style.animation = '';
    applyBreathRate();
  }

  // 把气泡身上因为“破云见日”临时加的内联样式清空，恢复成默认的循环动画，供下次冥想使用
  function resetBubbleFlourish(){
    breathBubble.style.animation = '';
    breathBubble.style.transform = '';
    breathBubble.style.boxShadow = '';
    breathBubble.style.transition = '';
  }

  function startMeditation(minutes){
    remainingSeconds = minutes * 60;
    updateCountdownDisplay();

    // 5.1 主界面在 1 秒内彻底冻结、淡出（由 body.meditating 的 CSS 强制接管）
    closeSupportPanel();
    closeMoreCities();
    document.body.classList.add('meditating');
    document.body.classList.remove('ui-visible');
    clearTimeout(hideTimer);

    // 5.2 主界面淡出得差不多时，先单独浮现一句身体姿势的提示——
    //     把“登高”落到身体感受上，而不是打卡天数这类游戏化的东西
    var CUE_APPEAR_AT   = 650;
    var CUE_HOLD_MS     = 1800;
    var CUE_FADE_OUT_MS = 900;

    setTimeout(function(){
      meditationCue.classList.add('show');
    }, CUE_APPEAR_AT);

    setTimeout(function(){
      meditationCue.classList.remove('show');
    }, CUE_APPEAR_AT + CUE_HOLD_MS);

    // 5.3 姿势提示完全隐去之后，呼吸气泡才浮现，强化仪式感、避免两者叠在一起
    setTimeout(function(){
      meditationLayer.classList.add('active');
      restartBubbleAnimation();
      scheduleBreathPhase(true);
    }, CUE_APPEAR_AT + CUE_HOLD_MS + CUE_FADE_OUT_MS);

    countdownTimer = setInterval(function(){
      remainingSeconds--;
      updateCountdownDisplay();
      if (remainingSeconds <= 0){
        naturalEnd();
      }
    }, 1000);
  }

  // 按吸气/呼气各自的时长递归排程，文字切换的时刻精确对应气泡放大到顶/缩回底的时刻，
  // 而不是像固定 setInterval 那样跟动画各走各的
  function scheduleBreathPhase(isInhale){
    breathText.textContent = isInhale ? '吸气...' : (Math.random() > 0.5 ? '呼气...' : '释怀...');
    breathText.style.opacity = '1';

    var phaseMs = (isInhale ? INHALE_RATIO : (1 - INHALE_RATIO)) * breathPeriod * 1000;
    var fadeLead = 300; // 提前 300ms 开始文字淡出，让切换看起来更顺滑，不生硬

    breathPhaseTimer = setTimeout(function(){
      breathText.style.opacity = '0';
      setTimeout(function(){
        scheduleBreathPhase(!isInhale);
      }, fadeLead);
    }, Math.max(300, phaseMs - fadeLead));
  }

  function changeBreathRate(deltaSeconds){
    breathPeriod = Math.min(MAX_PERIOD, Math.max(MIN_PERIOD, breathPeriod + deltaSeconds));
    restartBubbleAnimation();
    clearTimeout(breathPhaseTimer);
    scheduleBreathPhase(true); // 从吸气重新起一轮，避免调整瞬间画面和文字对不上
  }

  rateSlowerBtn.addEventListener('click', function(e){
    e.stopPropagation();
    changeBreathRate(1); // 周期变长 = 呼吸变慢
  });
  rateFasterBtn.addEventListener('click', function(e){
    e.stopPropagation();
    changeBreathRate(-1); // 周期变短 = 呼吸变快
  });

  function updateCountdownDisplay(){
    var m = Math.floor(remainingSeconds / 60);
    var s = remainingSeconds % 60;
    breathCountdown.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ============================================================
  // 6. 退出：分两种
  //    · naturalEnd()   —— 倒计时自然走完：破云见日 + 一句诗，再淡出
  //    · endMeditation() —— Esc / 双击：用户主动想立刻离开，跳过仪式，直接淡出
  // ============================================================

  // 真正把冥想层收起来、解冻主界面——两条退出路径最终都会走到这里
  function exitMeditation(){
    meditationLayer.classList.remove('active');
    meditationLayer.classList.remove('finale');
    meditationCue.classList.remove('show');
    resetBubbleFlourish();

    setTimeout(function(){
      document.body.classList.remove('meditating');
      selectedMinutes = null;
      durationBtns.forEach(function(b){ b.classList.remove('selected'); });
      startBtn.classList.remove('enabled');
      wake(); // 解冻并重新激活鼠标静止淡出监听，无缝回到隐形状态
    }, 1200);
  }

  function clearMeditationTimers(){
    clearInterval(countdownTimer);
    clearTimeout(breathPhaseTimer);
    clearTimeout(finaleTimer);
    countdownTimer = null;
    breathPhaseTimer = null;
    finaleTimer = null;
  }

  // 倒计时自然结束：气泡定格放大，光晕比平时更亮更大一瞬（“破云见日”），
  // 停顿片刻后气泡本体隐去、诗句浮现，停留 8 秒，再一起淡出
  function naturalEnd(){
    clearMeditationTimers();

    breathText.style.opacity = '0';
    breathBubble.style.animation = 'none';
    breathBubble.style.transform = 'scale(1.95)';
    breathBubble.style.transition = 'box-shadow 1.3s ease, transform 1.3s ease';
    breathBubble.style.boxShadow =
      '0 0 90px 30px rgba(255,255,255,0.5), 0 0 200px 70px rgba(255,255,255,0.2)';

    finaleTimer = setTimeout(function(){
      var poem = pickPoem();
      poemLine.textContent = poem.line;
      poemAuthor.textContent = poem.author;
      meditationLayer.classList.add('finale');

      finaleTimer = setTimeout(function(){
        exitMeditation();
      }, 8000); // 诗句停留 8 秒
    }, 1300);
  }

  // Esc / 双击：立刻退出，跳过破云见日和诗句
  function endMeditation(){
    clearMeditationTimers();
    exitMeditation();
  }

  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.body.classList.contains('meditating')){
      endMeditation();
    }
  });

  var lastTap = 0;
  meditationLayer.addEventListener('touchend', function(){
    var now = Date.now();
    if (now - lastTap < 350 && document.body.classList.contains('meditating')){
      endMeditation();
    }
    lastTap = now;
  });

})();
</script>

</body>
</html>
