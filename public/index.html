<style>
  :root{
    --ease-slow: cubic-bezier(0.22, 1, 0.36, 1);
    --ui-fade-in: 1.1s;
    --ui-fade-out: 1.8s;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    width:100%; height:100%;
    overflow:hidden;
    /* 即使图片加载失败，也不会是死气沉沉的纯黑，而是一层有呼吸感的夜色渐变 */
    background: radial-gradient(ellipse at 50% 40%, #1b212c 0%, #0a0c10 65%, #050608 100%);
    font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    cursor: default;
  }

  /* ============ 背景层：两张图交叉淡入淡出 ============ */
  /* 满铺裁切方案：直接把元素框定为 100vw × 100vh，再用 object-fit: cover 裁切，
     不管素材原始分辨率或宽高比是多少都能正确居中裁切满屏。
     （注：早期用过 min-width/min-height:100% + width/height:auto 的老技巧，
     这套写法在源素材宽高比与屏幕差异较大时会把框撑得远大于视口，叠加
     object-fit:cover 后只截取到其中一角，现已改用更稳健的写法；
     背景本身也已经从 <video> 全部换成 <img>，不再需要处理视频解码/
     缓冲相关的一整套复杂逻辑，这是全站目前最大的一次简化） */

  .bg-layer{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    pointer-events:none;      /* 关键防干扰：彻底禁止对背景的任何点击/长按交互 */
    user-select:none;
    background:#000;
    z-index:0;
    opacity:0;
    transition: opacity 0.3s ease;
  }
  .bg-layer.active{
    opacity:1;
    z-index:1;    /* 正在显示的那张图叠在上面，避免两张都 opacity:0 时露出中间的黑底 */
  }

  /* 夜间遮罩滤镜层：压暗画面，保证悬浮文字清晰可读
     注意：这里没有用 backdrop-filter，是历史遗留——以前背景是 <video> 时，
     backdrop-filter 在 Chromium 上采样视频背后画面有已知问题（视频常被提升到
     独立合成层，backdrop-filter 采样不到，导致整层渲染成纯黑）。
     现在背景已经全部改成图片，这个问题理论上不存在了，但纯色半透明叠加这个
     方案本身运行得很稳定，没必要为了“理论上更优雅”去动一个没问题的东西 */
  #bg-veil{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background: rgba(0,0,0,0.42);
  }

  /* 极轻的四角暗角，增加纵深与高级感 */
  #bg-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%);
  }

  /* ============ 界面总容器：负责统一呼吸式显隐 ============ */

  .ui-layer{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
  }

  .ui-fade{
    opacity:0;
    transition: opacity var(--ui-fade-out) var(--ease-slow);
    pointer-events:none;
  }
  body.ui-visible .ui-fade{
    opacity:1;
    transition: opacity var(--ui-fade-in) var(--ease-slow);
    pointer-events:auto;
  }

  /* 冥想模式：强制在 1 秒内彻底隐藏主界面，且无论鼠标如何移动都不再唤醒 */
  body.meditating .ui-fade{
    opacity:0 !important;
    pointer-events:none !important;
    transition: opacity 1s var(--ease-slow) !important;
  }
  body.meditating{
    cursor:none;
  }

  /* ============ 左上角：品牌文案组 ============ */

  .brand{
    position:fixed;
    top:5.5vh;
    left:5.5vw;
    z-index:11;
    text-align:left;
    user-select:none;
  }

  .brand__title{
    font-family: 'Noto Sans SC', sans-serif;
    font-weight:300;
    font-size:1.2rem;
    letter-spacing:0.18em;
    color:rgba(255,255,255,0.92);
    text-shadow: 0 1px 12px rgba(0,0,0,0.35);
  }

  .brand__title .en{
    font-family: 'Cormorant Garamond', 'Noto Sans SC', serif;
    font-style: italic;
    font-weight:300;
    letter-spacing:0.06em;
    opacity:0.75;
    margin-left:0.5em;
    font-size:0.92em;
  }

  .brand__divider{
    display:block;
    width:22px;
    height:1px;
    background:rgba(255,255,255,0.4);
    margin:0.85em 0;
  }

  .brand__subtitle{
    font-weight:300;
    font-size:0.9rem;
    letter-spacing:0.12em;
    color:rgba(255,255,255,0.6);
  }

  /* ============ 右上角：地标小注 ============ */
  /* 切换场景时短暂浮现，几秒后自动隐去——不挂在 .ui-fade 上，
     是因为它有自己的、比鼠标静止隐形更短的独立节奏 */

  .landmark-caption{
    position:fixed;
    top:5.5vh;
    right:5.5vw;
    z-index:11;
    font-weight:300;
    font-size:0.72rem;
    letter-spacing:0.14em;
    color:rgba(255,255,255,0.55);
    text-align:right;
    text-shadow: 0 1px 10px rgba(0,0,0,0.35);
    opacity:0;
    pointer-events:none;
    transition: opacity 1.2s ease;
    max-width:40vw;
  }
  .landmark-caption.show{
    opacity:1;
  }

  /* ============ 下方正中：毛玻璃控制面板 ============ */

  .control-panel{
    position:fixed;
    left:50%;
    bottom:6vh;
    transform:translateX(-50%);
    z-index:11;
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px 14px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }

  .scene-btn{
    appearance:none;
    -webkit-appearance:none;
    border:0;
    background:transparent;
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    transition: background 0.5s ease, transform 0.4s ease;
  }

  .scene-btn:hover{
    background:rgba(255,255,255,0.09);
  }

  .scene-btn svg{
    width:18px;
    height:18px;
    stroke:rgba(255,255,255,0.62);
    stroke-width:1;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition: stroke 0.5s ease, opacity 0.5s ease;
  }

  .scene-btn.active{
    background:rgba(255,255,255,0.13);
  }
  .scene-btn.active svg{
    stroke:rgba(255,255,255,0.98);
  }

  .scene-btn__label{
    position:absolute;
    bottom:calc(100% + 10px);
    left:50%;
    transform:translateX(-50%) translateY(4px);
    white-space:nowrap;
    font-size:0.68rem;
    letter-spacing:0.15em;
    font-weight:300;
    color:rgba(255,255,255,0.85);
    background:rgba(0,0,0,0.4);
    padding:4px 10px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    backdrop-filter: blur(6px);
  }

  .scene-btn:hover .scene-btn__label{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .panel-divider{
    width:1px;
    height:18px;
    background:rgba(255,255,255,0.16);
    margin:0 2px;
  }

  /* ============ 冥想时长气泡菜单 ============ */

  .time-picker{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:230px;
    padding:16px 18px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .time-picker.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  body.meditating .time-picker{
    opacity:0 !important;
    pointer-events:none !important;
  }

  /* ============ 支持我们 · 赞助/好物推荐气泡菜单 ============ */
  /* 与 .time-picker 同一套毛玻璃语言，保持视觉统一；默认不参与 3 秒静止隐形，
     仅在用户主动点开时出现，关闭方式与冥想时长菜单完全一致 */

  .support-panel{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:250px;
    max-width:86vw;
    padding:18px 20px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:12px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .support-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  body.meditating .support-panel{
    opacity:0 !important;
    pointer-events:none !important;
  }

  .support-panel__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
    text-align:center;
  }

  .support-panel__afdian{
    display:block;
    text-align:center;
    text-decoration:none;
    font-family:inherit;
    font-weight:300;
    font-size:0.8rem;
    letter-spacing:0.08em;
    color:rgba(255,255,255,0.92);
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:999px;
    padding:9px 18px;
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .support-panel__afdian:hover{
    background:rgba(255,255,255,0.18);
    border-color:rgba(255,255,255,0.6);
  }

  .support-panel__about{
    display:block;
    text-align:center;
    font-family:inherit;
    font-weight:300;
    font-size:0.68rem;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.4);
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.15);
    padding-bottom:1px;
    align-self:center;
    transition: color 0.4s ease, border-color 0.4s ease;
  }
  .support-panel__about:hover{
    color:rgba(255,255,255,0.75);
    border-color:rgba(255,255,255,0.5);
  }

  /* ============ 更多城市 · 展开面板 ============ */

  .more-cities-panel{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:230px;
    padding:16px 18px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .more-cities-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  body.meditating .more-cities-panel{
    opacity:0 !important;
    pointer-events:none !important;
  }

  .more-cities-panel__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
  }

  .more-cities-panel__list{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
  }

  .more-cities-panel__item{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.04);
    color:rgba(255,255,255,0.75);
    font-family:inherit;
    font-weight:300;
    font-size:0.75rem;
    letter-spacing:0.08em;
    padding:8px 16px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }
  .more-cities-panel__item:hover{
    border-color:rgba(255,255,255,0.45);
  }
  .more-cities-panel__item.active{
    background:rgba(255,255,255,0.85);
    color:rgba(10,10,10,0.85);
    border-color:rgba(255,255,255,0.85);
  }

  /* ============ 背景音乐开关图标 ============ */
  /* 默认显示“静音”图标；点开后切到“播放中”图标，两者互斥显示 */
  .scene-btn .icon-music-on{ display:none; }
  .scene-btn.active .icon-music-off{ display:none; }
  .scene-btn.active .icon-music-on{ display:block; }

  .time-picker__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
  }

  .time-picker__modes{
    display:flex;
    gap:8px;
  }

  .time-picker__mode{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.04);
    color:rgba(255,255,255,0.7);
    font-family:inherit;
    font-weight:300;
    font-size:0.74rem;
    letter-spacing:0.06em;
    padding:8px 15px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }
  .time-picker__mode:hover{
    border-color:rgba(255,255,255,0.45);
  }
  .time-picker__mode.active{
    background:rgba(255,255,255,0.85);
    color:rgba(10,10,10,0.85);
    border-color:rgba(255,255,255,0.85);
  }

  .time-picker__options{
    display:flex;
    gap:8px;
  }

  .time-picker__option{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.04);
    color:rgba(255,255,255,0.75);
    font-family:inherit;
    font-weight:300;
    font-size:0.75rem;
    letter-spacing:0.08em;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }

  .time-picker__option:hover{
    border-color:rgba(255,255,255,0.45);
  }

  .time-picker__option.selected{
    background:rgba(255,255,255,0.85);
    color:rgba(10,10,10,0.85);
    border-color:rgba(255,255,255,0.85);
  }

  .time-picker__start{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.3);
    background:transparent;
    color:rgba(255,255,255,0.35);
    font-family:inherit;
    font-weight:300;
    font-size:0.78rem;
    letter-spacing:0.25em;
    padding:8px 26px;
    border-radius:999px;
    cursor:not-allowed;
    transition: all 0.4s ease;
  }

  .time-picker__start.enabled{
    color:rgba(255,255,255,0.95);
    border-color:rgba(255,255,255,0.7);
    cursor:pointer;
  }
  .time-picker__start.enabled:hover{
    background:rgba(255,255,255,0.12);
  }

  /* ============ 中央呼吸冥想气泡（Pixel Thoughts 致敬）============ */

  .meditation-layer{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:32px;
    opacity:0;
    pointer-events:none;
    transition: opacity 1.4s var(--ease-slow);
  }
  .meditation-layer.active{
    opacity:1;
    pointer-events:auto;
  }

  .breath-bubble{
    width:80px;
    height:80px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 35% 32%, rgba(255,255,255,0.4), rgba(255,255,255,0.05) 72%);
    border:1px solid rgba(255,255,255,0.4);
    animation-name: breathe;
    animation-iteration-count: infinite;
    animation-duration: 8s;   /* JS 会按用户调节的速率实时改写这个值 */
    will-change: transform, box-shadow;
  }

  /* 呼吸节奏做成不对称的：吸气（0%→42%）稍快，是主动的肌肉收缩；
     呼气（42%→100%）更长更缓，是被动的弹性回缩——
     这跟人真实呼吸时“吸气用力、呼气放松”的力学特征是一致的，
     配合每个关键帧各自的 easing，让扩张收缩的加减速也更接近有机的肺部运动，
     而不是机械对称的正弦波 */
  @keyframes breathe{
    0%   { transform:scale(1);    box-shadow:0 0 20px 4px rgba(255,255,255,0.14), 0 0 46px 14px rgba(255,255,255,0.05); animation-timing-function: cubic-bezier(0.45, 0, 0.4, 1); }
    42%  { transform:scale(1.85); box-shadow:0 0 60px 20px rgba(255,255,255,0.32), 0 0 120px 36px rgba(255,255,255,0.12); animation-timing-function: cubic-bezier(0.55, 0, 0.35, 1); }
    100% { transform:scale(1);    box-shadow:0 0 20px 4px rgba(255,255,255,0.14), 0 0 46px 14px rgba(255,255,255,0.05); }
  }

  .breath-bubble__text{
    font-weight:300;
    font-size:0.78rem;
    letter-spacing:0.15em;
    color:rgba(255,255,255,0.88);
    transition: opacity 0.6s ease;
    white-space:nowrap;
  }

  .breath-countdown{
    font-weight:300;
    font-size:0.72rem;
    letter-spacing:0.22em;
    color:rgba(255,255,255,0.38);
    font-variant-numeric: tabular-nums;
  }

  /* ============ 呼吸节奏手动调节 ============ */

  .breath-rate{
    display:flex;
    align-items:center;
    gap:14px;
    opacity:0.55;
    transition: opacity 0.3s ease;
  }
  .breath-rate:hover{
    opacity:0.95;
  }

  .breath-rate__btn{
    appearance:none;
    -webkit-appearance:none;
    background:transparent;
    border:1px solid rgba(255,255,255,0.28);
    color:rgba(255,255,255,0.8);
    width:26px;
    height:26px;
    border-radius:50%;
    font-size:0.85rem;
    line-height:1;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background 0.35s ease, border-color 0.35s ease;
  }
  .breath-rate__btn:hover{
    background:rgba(255,255,255,0.14);
    border-color:rgba(255,255,255,0.55);
  }

  .breath-rate__value{
    font-size:0.62rem;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.5);
    font-variant-numeric: tabular-nums;
    min-width:84px;
    text-align:center;
  }

  /* ============ 破云见日 · 诗句 ============ */
  /* 倒计时自然结束时：气泡本体、倒计时、调速控件一起淡出，
     诗句在原来的位置浮现，停留片刻后随一切一起消失 */

  .meditation-layer.finale .breath-bubble,
  .meditation-layer.finale .breath-countdown,
  .meditation-layer.finale .breath-rate,
  .meditation-layer.finale .contemplation-glow{
    opacity:0;
    transition: opacity 1s ease;
  }

  .breath-poem{
    opacity:0;
    pointer-events:none;
    transition: opacity 1.6s var(--ease-slow);
    text-align:center;
    max-width:78vw;
  }
  .meditation-layer.finale .breath-poem{
    opacity:1;
  }

  .breath-poem__line{
    font-weight:300;
    font-size:1.05rem;
    letter-spacing:0.14em;
    line-height:2;
    color:rgba(255,255,255,0.92);
    text-shadow: 0 1px 16px rgba(0,0,0,0.4);
  }

  .breath-poem__author{
    margin-top:12px;
    font-size:0.66rem;
    letter-spacing:0.22em;
    color:rgba(255,255,255,0.42);
  }

  .breath-hint{
    position:fixed;
    bottom:4.5vh;
    left:50%;
    transform:translateX(-50%);
    font-size:0.62rem;
    letter-spacing:0.12em;
    color:rgba(255,255,255,0.26);
    font-weight:300;
    white-space:nowrap;
  }

  /* ============ 冥想开场：找个坐直的姿势 ============ */

  .meditation-cue{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:21;
    font-weight:300;
    font-size:0.9rem;
    letter-spacing:0.16em;
    color:rgba(255,255,255,0.75);
    text-align:center;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition: opacity 1s ease;
  }
  .meditation-cue.show{
    opacity:1;
  }

  /* ============ 正念阅读提示 ============ */

  .mindfulness-prompt{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:21;
    font-weight:300;
    font-size:1.05rem;
    letter-spacing:0.1em;
    line-height:2.1;
    color:rgba(255,255,255,0.82);
    text-align:center;
    max-width:66vw;
    text-shadow: 0 1px 14px rgba(0,0,0,0.35);
    opacity:0;
    pointer-events:none;
    transition: opacity 1.1s ease;
  }
  .mindfulness-prompt.show{
    opacity:1;
  }

  /* ============ 沉思阅读模式 ============ */

  .contemplation-intro{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:21;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
    max-width:60vw;
    opacity:0;
    pointer-events:none;
    transition: opacity 1.3s ease;
  }
  .contemplation-intro.show{
    opacity:1;
    pointer-events:auto; /* 这个阶段需要能点“我准备好了” */
  }

  .contemplation-theme{
    font-weight:300;
    font-size:1.4rem;
    letter-spacing:0.32em;
    color:rgba(255,255,255,0.92);
    text-shadow: 0 1px 16px rgba(0,0,0,0.4);
  }

  .contemplation-passage{
    font-weight:300;
    font-size:1rem;
    letter-spacing:0.08em;
    line-height:2.3;
    color:rgba(255,255,255,0.8);
    text-align:center;
    white-space:pre-line;
    text-shadow: 0 1px 14px rgba(0,0,0,0.35);
  }

  .contemplation-begin{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.92);
    font-family:inherit;
    font-weight:300;
    font-size:0.8rem;
    letter-spacing:0.16em;
    padding:10px 30px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .contemplation-begin:hover{
    background:rgba(255,255,255,0.16);
    border-color:rgba(255,255,255,0.75);
  }

  /* 望远模式结尾的收束语：不是诗句，是针对这次主题的具体建议 */
  .contemplation-closing{
    opacity:0;
    pointer-events:none;
    transition: opacity 1.6s var(--ease-slow);
    text-align:center;
    max-width:66vw;
    font-weight:300;
    font-size:0.92rem;
    letter-spacing:0.05em;
    line-height:1.9;
    color:rgba(255,255,255,0.75);
    text-shadow: 0 1px 12px rgba(0,0,0,0.35);
  }

  /* 呼吸（释怀）模式结尾用诗句，望远模式结尾用收束语——两者互斥显示 */
  .meditation-layer.finale .breath-poem{
    opacity:1;
  }
  .meditation-layer.mode-contemplate.finale .breath-poem{
    opacity:0;
  }
  .meditation-layer.mode-contemplate.finale .contemplation-closing{
    opacity:1;
  }


  /* 安静专注期的光点：比呼吸气泡慢得多、也简单得多，没有文字、没有明显的“动作感”，
     只是缓缓地亮一点、暗一点，代表“什么都不用做，只是在这里” */
  .contemplation-glow{
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    box-shadow: 0 0 30px 10px rgba(255,255,255,0.25), 0 0 60px 20px rgba(255,255,255,0.1);
    animation: contemplationPulse 9s ease-in-out infinite;
    display:none; /* 默认隐藏，沉思模式下才显示 */
  }
  @keyframes contemplationPulse{
    0%   { opacity:0.35; transform:scale(1); }
    50%  { opacity:1;    transform:scale(1.4); }
    100% { opacity:0.35; transform:scale(1); }
  }

  /* 沉思模式下：隐藏呼吸气泡和调速控件（沉思没有呼吸节奏可调），显示光点 */
  .meditation-layer.mode-contemplate .breath-bubble,
  .meditation-layer.mode-contemplate #breathRateControl{
    display:none;
  }
  .meditation-layer.mode-contemplate .contemplation-glow{
    display:block;
  }

  /* ============ 移动端适配 ============ */

  @media (max-width: 640px){
    .brand{ top:6.5vh; left:6vw; }
    .brand__title{ font-size:1.05rem; }
    .brand__subtitle{ font-size:0.78rem; }
    .landmark-caption{ top:6.5vh; right:6vw; font-size:0.66rem; max-width:48vw; }
    .control-panel{ bottom:5vh; padding:8px 10px; gap:2px; }
    .scene-btn{ width:38px; height:38px; }
    .scene-btn__label{ display:none; } /* 触屏无 hover，隐藏文字气泡 */
    .time-picker{ bottom:calc(5vh + 66px); min-width:210px; }
    .support-panel{ bottom:calc(5vh + 66px); min-width:210px; }
    .more-cities-panel{ bottom:calc(5vh + 66px); min-width:210px; }
    .contemplation-intro{ max-width:84vw; }
    .contemplation-passage{ font-size:0.92rem; }
    .contemplation-theme{ font-size:1.2rem; }
  }

  /* 无障碍：尊重系统的“减少动态效果”偏好 */
  @media (prefers-reduced-motion: reduce){
    .ui-fade{ transition-duration: 0.2s !important; }
    .bg-layer{ transition-duration: 0.15s !important; }
    .breath-bubble{ animation-duration: 12s; }
  }
</style>

  </div>

  // 背景音乐：跟背景图一样支持“素材库 + 随机播放”，用双 <audio> 交叉淡入淡出
  // 实现无缝切歌，一首快放完时提前切下一首，不会有静音空隙。
  // 默认不自动播放（浏览器策略也不允许带声音的音频自动播放），需要用户主动点开。
  // 曲库大小完全灵活，往数组里加/删链接即可
  // ============================================================
  var AUDIO_TRACKS = [
    '/audio/ambient-1.mp3',
    '/audio/ambient-2.mp3',
    '/audio/ambient-3.mp3'
    // 继续往下加即可
  ];
  var CROSSFADE_SECONDS = 2.5;
  var TARGET_VOLUME = 0.35;

  var audios = [document.getElementById('bg-audio-1'), document.getElementById('bg-audio-2')];
  var activeAudioIndex = 0;
  var lastAudioTrack = null;
  var musicBtn = document.getElementById('musicBtn');
  var musicOn  = false;

  function pickTrack(){
    if (!AUDIO_TRACKS.length) return null;
    if (AUDIO_TRACKS.length === 1) return AUDIO_TRACKS[0];
    var idx;
    do {
      idx = Math.floor(Math.random() * AUDIO_TRACKS.length);
    } while (AUDIO_TRACKS[idx] === lastAudioTrack);
    lastAudioTrack = AUDIO_TRACKS[idx];
    return AUDIO_TRACKS[idx];
  }

  function fadeVolume(el, from, to, duration, done){
    var start = null;
    function step(ts){
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / duration);
      el.volume = from + (to - from) * p;
      if (p < 1){
        requestAnimationFrame(step);
      } else if (done){
        done();
      }
    }
    requestAnimationFrame(step);
  }

  // 监听当前播放曲目的剩余时间，快放完时提前触发交叉切歌，避免留白静音
  function watchForCrossfade(el){
    function onTimeUpdate(){
      if (!musicOn){ return; }
      if (el.duration && (el.duration - el.currentTime) <= CROSSFADE_SECONDS){
        el.removeEventListener('timeupdate', onTimeUpdate);
        crossfadeToNextTrack();
      }
    }
    el.addEventListener('timeupdate', onTimeUpdate);
  }

  function crossfadeToNextTrack(){
    if (!musicOn) return;
    var current    = audios[activeAudioIndex];
    var nextIndex  = 1 - activeAudioIndex;
    var next       = audios[nextIndex];
    var track      = pickTrack();
    if (!track) return;

    next.src = track;
    next.load();
    next.addEventListener('canplay', function onReady(){
      next.removeEventListener('canplay', onReady);
      next.volume = 0;
      var p = next.play();
      if (p && p.catch){ p.catch(function(err){ console.warn('[高楼之巅] 背景音乐播放失败：', err); }); }
      fadeVolume(next, 0, TARGET_VOLUME, CROSSFADE_SECONDS * 1000);
      fadeVolume(current, current.volume, 0, CROSSFADE_SECONDS * 1000, function(){ current.pause(); });
      activeAudioIndex = nextIndex;
      watchForCrossfade(next);
    }, { once:true });
  }

    breathBubble.style.animationDuration = breathPeriod + 's';
  }

  // 让 CSS 里的 scale 动画从头重新开始播放，跟下面 JS 排的文字节奏对齐
  function restartBubbleAnimation(){
    breathBubble.style.animation = 'none';
    void breathBubble.offsetWidth; // 强制重排，这一行不能删
    breathBubble.style.animation = '';
    applyBreathRate();
  }

  // 把气泡身上因为“破云见日”临时加的内联样式清空，恢复成默认的循环动画，供下次冥想使用
  function resetBubbleFlourish(){
    breathBubble.style.animation = '';
    breathBubble.style.transform = '';
    breathBubble.style.boxShadow = '';
    breathBubble.style.transition = '';
  }

  // 沉思模式的光点也有同样的“临时内联样式”要清空
  function resetGlowFlourish(){
    contemplationGlow.style.animation = '';
    contemplationGlow.style.transform = '';
    contemplationGlow.style.boxShadow = '';
    contemplationGlow.style.opacity = '';
    contemplationGlow.style.transition = '';
  }

  // 真正把冥想层收起来、解冻主界面——两条退出路径最终都会走到这里
  function exitMeditation(){
    meditationLayer.classList.remove('active');
    meditationLayer.classList.remove('finale');
    meditationLayer.classList.remove('mode-contemplate');
    meditationCue.classList.remove('show');
    mindfulnessPrompt.classList.remove('show');
    contemplationIntro.classList.remove('show');
    currentPassageEntry = null;
    resetBubbleFlourish();
    resetGlowFlourish();

    setTimeout(function(){
      document.body.classList.remove('meditating');
      selectedMinutes = null;
      durationBtns.forEach(function(b){ b.classList.remove('selected'); });
      startBtn.classList.remove('enabled');
      wake(); // 解冻并重新激活鼠标静止淡出监听，无缝回到隐形状态
    }, 1200);
  }

  function clearMeditationTimers(){
    clearInterval(countdownTimer);
    clearTimeout(breathPhaseTimer);
    clearTimeout(finaleTimer);
    ritualTimers.forEach(clearTimeout); // 开场仪式（姿势提示/正念阅读/呼吸浮现）还没触发的那些也要清掉
    ritualTimers = [];
    countdownTimer = null;
    breathPhaseTimer = null;
    finaleTimer = null;
  }

  // 倒计时自然结束：呼吸模式是气泡定格放大、光晕更亮一瞬（“破云见日”）；
  // 沉思模式是光点短暂亮起来。两种模式最终都汇合到同一句诗收尾
  function naturalEnd(){
    clearMeditationTimers();

    if (currentPracticeMode === 'contemplate'){
      contemplationGlow.style.animation = 'none';
      contemplationGlow.style.transform = 'scale(2.4)';
      contemplationGlow.style.opacity = '1';
      contemplationGlow.style.transition = 'opacity 1.3s ease, transform 1.3s ease';
      contemplationGlow.style.boxShadow =
        '0 0 60px 20px rgba(255,255,255,0.5), 0 0 140px 46px rgba(255,255,255,0.2)';
    } else {
      breathText.style.opacity = '0';
      breathBubble.style.animation = 'none';
      breathBubble.style.transform = 'scale(1.95)';
      breathBubble.style.transition = 'box-shadow 1.3s ease, transform 1.3s ease';
      breathBubble.style.boxShadow =
        '0 0 90px 30px rgba(255,255,255,0.5), 0 0 200px 70px rgba(255,255,255,0.2)';
    }

    finaleTimer = setTimeout(function(){
      if (currentPracticeMode === 'contemplate' && currentPassageEntry){
        contemplationClosing.textContent = currentPassageEntry.closing;
      } else {
        var poem = pickPoem();
        poemLine.textContent = poem.line;
        poemAuthor.textContent = poem.author;
      }
      meditationLayer.classList.add('finale');

      finaleTimer = setTimeout(function(){
        exitMeditation();
      }, 8000); // 停留 8 秒
    }, 1300);
  }

  var currentPracticeMode = 'breath'; // 这次正在跑的是哪个模式（跟选择器里“下次要用哪个”的 practiceMode 分开）

  function startMeditation(minutes){
    currentPracticeMode = 'breath';
    meditationLayer.classList.remove('mode-contemplate');

    // 5.1 主界面在 1 秒内彻底冻结、淡出（由 body.meditating 的 CSS 强制接管）
    closeSupportPanel();
    closeMoreCities();
    document.body.classList.add('meditating');
    document.body.classList.remove('ui-visible');
    clearTimeout(hideTimer);

    // 5.2 开场仪式：姿势提示 → 正念阅读 → 呼吸引导，依次浮现、依次隐去，
    //     每一段之间留出停顿，不会叠在一起。倒计时故意不在这时候起算，
    //     等呼吸真正开始才起算，这样选的 1/3/5 分钟是完整用在呼吸练习本身、
    //     不会被前面的仪式环节吃掉一截
    var CUE_APPEAR_AT   = 650;
    var CUE_HOLD_MS     = 1800;
    var CUE_FADE_OUT_MS = 900;

    var PROMPT_APPEAR_AT = CUE_APPEAR_AT + CUE_HOLD_MS + CUE_FADE_OUT_MS;
    var PROMPT_HOLD_MS   = 4500; // 一整句话，比 6 个字的姿势提示需要更长的阅读时间
    var PROMPT_FADE_OUT_MS = 900;

    var BUBBLE_APPEAR_AT = PROMPT_APPEAR_AT + PROMPT_HOLD_MS + PROMPT_FADE_OUT_MS;

    ritualTimers.push(setTimeout(function(){
      meditationCue.classList.add('show');
    }, CUE_APPEAR_AT));

    ritualTimers.push(setTimeout(function(){
      meditationCue.classList.remove('show');
    }, CUE_APPEAR_AT + CUE_HOLD_MS));

    ritualTimers.push(setTimeout(function(){
      mindfulnessPrompt.textContent = pickMindfulnessPrompt();
      mindfulnessPrompt.classList.add('show');
    }, PROMPT_APPEAR_AT));

    ritualTimers.push(setTimeout(function(){
      mindfulnessPrompt.classList.remove('show');
    }, PROMPT_APPEAR_AT + PROMPT_HOLD_MS));

    // 5.3 正念提示完全隐去之后，呼吸气泡才浮现，倒计时也是这时候才真正开始走
    ritualTimers.push(setTimeout(function(){
      meditationLayer.classList.add('active');
      restartBubbleAnimation();
      scheduleBreathPhase(true);

      remainingSeconds = minutes * 60;
      updateCountdownDisplay();
      countdownTimer = setInterval(function(){
        remainingSeconds--;
        updateCountdownDisplay();
        if (remainingSeconds <= 0){
          naturalEnd();
        }
      }, 1000);
    }, BUBBLE_APPEAR_AT));
  }

  // 沉思阅读模式：跟呼吸引导共用同一套开场仪式骨架（姿势提示 → 正文 → 正式开始），
  // 只是中间读的内容更长（完整一段短文，不是一句话），呼吸气泡换成安静的光点，
  // 也没有呼吸节奏可调——沉思本身没有“节奏”这回事
  var currentPassageEntry = null; // 记住这次选中的是哪一段，结尾要用它的 closing 收束语
  var contemplationMinutesPending = 0;

  function startContemplation(minutes){
    currentPracticeMode = 'contemplate';
    meditationLayer.classList.add('mode-contemplate');
    contemplationMinutesPending = minutes;

    closeSupportPanel();
    closeMoreCities();
    document.body.classList.add('meditating');
    document.body.classList.remove('ui-visible');
    clearTimeout(hideTimer);

    var CUE_APPEAR_AT   = 650;
    var CUE_HOLD_MS     = 1800;
    var CUE_FADE_OUT_MS = 900;
    var INTRO_APPEAR_AT = CUE_APPEAR_AT + CUE_HOLD_MS + CUE_FADE_OUT_MS;

    ritualTimers.push(setTimeout(function(){
      meditationCue.classList.add('show');
    }, CUE_APPEAR_AT));

    ritualTimers.push(setTimeout(function(){
      meditationCue.classList.remove('show');
    }, CUE_APPEAR_AT + CUE_HOLD_MS));

    // 主题词 + 短文一起浮现，之后不再自动往下走——
    // 跟“释怀”呼吸模式全自动播放不同，这里刻意让用户自己读完、自己点“我准备好了”
    // 才真正进入安静专注期，节奏交给用户自己掌握
    ritualTimers.push(setTimeout(function(){
      currentPassageEntry = pickPassage();
      contemplationTheme.textContent = currentPassageEntry.theme;
      contemplationPassage.textContent = currentPassageEntry.passage;
      contemplationIntro.classList.add('show');
    }, INTRO_APPEAR_AT));
  }

  // “我准备好了”：主题+短文淡出，稍作停顿后光点浮现，倒计时这时候才真正开始走——
  // 选的 1/3/5 分钟完整用在安静专注本身，不会被前面的阅读环节吃掉
  contemplationBegin.addEventListener('click', function(e){
    e.stopPropagation();
    if (!document.body.classList.contains('meditating') || currentPracticeMode !== 'contemplate') return;

    contemplationIntro.classList.remove('show');

    var glowTimer = setTimeout(function(){
      meditationLayer.classList.add('active');

      remainingSeconds = contemplationMinutesPending * 60;
      updateCountdownDisplay();
      countdownTimer = setInterval(function(){
        remainingSeconds--;
        updateCountdownDisplay();
        if (remainingSeconds <= 0){
          naturalEnd();
        }
      }, 1000);
    }, 900);
    ritualTimers.push(glowTimer);
  });

  // 按吸气/呼气各自的时长递归排程，文字切换的时刻精确对应气泡放大到顶/缩回底的时刻，
  // 而不是像固定 setInterval 那样跟动画各走各的
  function scheduleBreathPhase(isInhale){
    breathText.textContent = isInhale ? '吸气...' : (Math.random() > 0.5 ? '呼气...' : '释怀...');
    breathText.style.opacity = '1';

    var phaseMs = (isInhale ? INHALE_RATIO : (1 - INHALE_RATIO)) * breathPeriod * 1000;
    var fadeLead = 300; // 提前 300ms 开始文字淡出，让切换看起来更顺滑，不生硬

    breathPhaseTimer = setTimeout(function(){
      breathText.style.opacity = '0';
      setTimeout(function(){
        scheduleBreathPhase(!isInhale);
      }, fadeLead);
    }, Math.max(300, phaseMs - fadeLead));
  }

  function changeBreathRate(deltaSeconds){
    breathPeriod = Math.min(MAX_PERIOD, Math.max(MIN_PERIOD, breathPeriod + deltaSeconds));
    restartBubbleAnimation();
    clearTimeout(breathPhaseTimer);
    scheduleBreathPhase(true); // 从吸气重新起一轮，避免调整瞬间画面和文字对不上
  }

  rateSlowerBtn.addEventListener('click', function(e){
    e.stopPropagation();
    changeBreathRate(1); // 周期变长 = 呼吸变慢
  });
  rateFasterBtn.addEventListener('click', function(e){
    e.stopPropagation();
    changeBreathRate(-1); // 周期变短 = 呼吸变快
  });

  function updateCountdownDisplay(){
    var m = Math.floor(remainingSeconds / 60);
    var s = remainingSeconds % 60;
    breathCountdown.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ============================================================
  // 6. 退出：分两种
  //    · naturalEnd()   —— 倒计时自然走完：破云见日 + 一句诗，再淡出
  //    · endMeditation() —— Esc / 双击：用户主动想立刻离开，跳过仪式，直接淡出
  // ============================================================

  // Esc / 双击：立刻退出，跳过破云见日和诗句
  function endMeditation(){
    clearMeditationTimers();
    exitMeditation();
  }

  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.body.classList.contains('meditating')){
      endMeditation();
    }
  });

  var lastTap = 0;
  meditationLayer.addEventListener('touchend', function(){
    var now = Date.now();
    if (now - lastTap < 350 && document.body.classList.contains('meditating')){
      endMeditation();
    }
    lastTap = now;
  });

})();
</script>

</body>
