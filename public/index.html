<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>高楼之巅 | gaolou.org</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

<style>
  :root{
    --ease-slow: cubic-bezier(0.22, 1, 0.36, 1);
    --ui-fade-in: 1.1s;
    --ui-fade-out: 1.8s;
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    width:100%; height:100%;
    overflow:hidden;
    /* 即使视频加载失败，也不会是死气沉沉的纯黑，而是一层有呼吸感的夜色渐变 */
    background: radial-gradient(ellipse at 50% 40%, #1b212c 0%, #0a0c10 65%, #050608 100%);
    font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    cursor: default;
  }

  /* ============ 原生 <video> 背景层 ============ */
  /* 满铺裁切方案：直接把视频框定为 100vw × 100vh，再用 object-fit: cover 裁切，
     不管视频原始分辨率或宽高比是多少都能正确居中裁切满屏。
     （注：之前用的是 min-width/min-height:100% + width/height:auto 的老技巧，
     这套写法在源视频宽高比与屏幕差异较大、尤其是高分辨率素材时，
     会把视频框撑得远大于视口，叠加 object-fit:cover 后只截取到其中一角，
     这正是“视频显示不全、只看到一个角落”的根因，现已彻底改用更稳健的写法） */

  .bg-video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    z-index:0;
    pointer-events:none;      /* 关键防干扰：彻底禁止对背景视频的任何点击/长按交互 */
    user-select:none;
    opacity:0;
    transition: opacity 1.2s ease;
    background:#000;
  }

  /* 双 video 叠层，用于无闪烁的平滑交叉淡入淡出切换 */
  .bg-video.active{
    opacity:1;
  }

  /* 夜间遮罩滤镜层：压暗视频，保证悬浮文字清晰可读
     注意：这里刻意不用 backdrop-filter —— 它在采样 <video> 元素背后画面时
     在 Chromium 上有已知问题（视频常被提升到独立合成层，backdrop-filter 采样不到，
     导致整层渲染成纯黑），改用纯色半透明叠加来压暗，效果一致且稳定可靠 */
  #bg-veil{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background: rgba(0,0,0,0.42);
  }

  /* 极轻的四角暗角，增加纵深与高级感 */
  #bg-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(0,0,0,0.35) 100%);
  }

  /* ============ 界面总容器：负责统一呼吸式显隐 ============ */

  .ui-layer{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
  }

  .ui-fade{
    opacity:0;
    transition: opacity var(--ui-fade-out) var(--ease-slow);
    pointer-events:none;
  }
  body.ui-visible .ui-fade{
    opacity:1;
    transition: opacity var(--ui-fade-in) var(--ease-slow);
    pointer-events:auto;
  }

  /* 冥想模式：强制在 1 秒内彻底隐藏主界面，且无论鼠标如何移动都不再唤醒 */
  body.meditating .ui-fade{
    opacity:0 !important;
    pointer-events:none !important;
    transition: opacity 1s var(--ease-slow) !important;
  }
  body.meditating{
    cursor:none;
  }

  /* ============ 左上角：品牌文案组 ============ */

  .brand{
    position:fixed;
    top:5.5vh;
    left:5.5vw;
    z-index:11;
    text-align:left;
    user-select:none;
  }

  .brand__title{
    font-family: 'Noto Sans SC', sans-serif;
    font-weight:300;
    font-size:1.2rem;
    letter-spacing:0.18em;
    color:rgba(255,255,255,0.92);
    text-shadow: 0 1px 12px rgba(0,0,0,0.35);
  }

  .brand__title .en{
    font-family: 'Cormorant Garamond', 'Noto Sans SC', serif;
    font-style: italic;
    font-weight:300;
    letter-spacing:0.06em;
    opacity:0.75;
    margin-left:0.5em;
    font-size:0.92em;
  }

  .brand__divider{
    display:block;
    width:22px;
    height:1px;
    background:rgba(255,255,255,0.4);
    margin:0.85em 0;
  }

  .brand__subtitle{
    font-weight:300;
    font-size:0.9rem;
    letter-spacing:0.12em;
    color:rgba(255,255,255,0.6);
  }

  /* ============ 下方正中：毛玻璃控制面板 ============ */

  .control-panel{
    position:fixed;
    left:50%;
    bottom:6vh;
    transform:translateX(-50%);
    z-index:11;
    display:flex;
    align-items:center;
    gap:6px;
    padding:10px 14px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }

  .scene-btn{
    appearance:none;
    -webkit-appearance:none;
    border:0;
    background:transparent;
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    position:relative;
    transition: background 0.5s ease, transform 0.4s ease;
  }

  .scene-btn:hover{
    background:rgba(255,255,255,0.09);
  }

  .scene-btn svg{
    width:18px;
    height:18px;
    stroke:rgba(255,255,255,0.62);
    stroke-width:1;
    fill:none;
    stroke-linecap:round;
    stroke-linejoin:round;
    transition: stroke 0.5s ease, opacity 0.5s ease;
  }

  .scene-btn.active{
    background:rgba(255,255,255,0.13);
  }
  .scene-btn.active svg{
    stroke:rgba(255,255,255,0.98);
  }

  .scene-btn__label{
    position:absolute;
    bottom:calc(100% + 10px);
    left:50%;
    transform:translateX(-50%) translateY(4px);
    white-space:nowrap;
    font-size:0.68rem;
    letter-spacing:0.15em;
    font-weight:300;
    color:rgba(255,255,255,0.85);
    background:rgba(0,0,0,0.4);
    padding:4px 10px;
    border-radius:6px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.35s ease, transform 0.35s ease;
    backdrop-filter: blur(6px);
  }

  .scene-btn:hover .scene-btn__label{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  .panel-divider{
    width:1px;
    height:18px;
    background:rgba(255,255,255,0.16);
    margin:0 2px;
  }

  /* ============ 冥想时长气泡菜单 ============ */

  .time-picker{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:230px;
    padding:16px 18px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .time-picker.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  body.meditating .time-picker{
    opacity:0 !important;
    pointer-events:none !important;
  }

  /* ============ 支持我们 · 赞助/好物推荐气泡菜单 ============ */
  /* 与 .time-picker 同一套毛玻璃语言，保持视觉统一；默认不参与 3 秒静止隐形，
     仅在用户主动点开时出现，关闭方式与冥想时长菜单完全一致 */

  .support-panel{
    position:fixed;
    left:50%;
    bottom:calc(6vh + 74px);
    transform:translateX(-50%) translateY(8px);
    z-index:13;
    min-width:250px;
    max-width:86vw;
    padding:18px 20px;
    border-radius:22px;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 10px 34px rgba(0,0,0,0.32);
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:12px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.45s var(--ease-slow), transform 0.45s var(--ease-slow);
  }
  .support-panel.open{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(0);
  }
  body.meditating .support-panel{
    opacity:0 !important;
    pointer-events:none !important;
  }

  .support-panel__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
    text-align:center;
  }

  .support-panel__afdian{
    display:block;
    text-align:center;
    text-decoration:none;
    font-family:inherit;
    font-weight:300;
    font-size:0.8rem;
    letter-spacing:0.08em;
    color:rgba(255,255,255,0.92);
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:999px;
    padding:9px 18px;
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .support-panel__afdian:hover{
    background:rgba(255,255,255,0.18);
    border-color:rgba(255,255,255,0.6);
  }

  /* ============ 背景音乐开关图标 ============ */
  /* 默认显示“静音”图标；点开后切到“播放中”图标，两者互斥显示 */
  .scene-btn .icon-music-on{ display:none; }
  .scene-btn.active .icon-music-off{ display:none; }
  .scene-btn.active .icon-music-on{ display:block; }

  .time-picker__label{
    font-size:0.68rem;
    letter-spacing:0.2em;
    font-weight:300;
    color:rgba(255,255,255,0.5);
  }

  .time-picker__options{
    display:flex;
    gap:8px;
  }

  .time-picker__option{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.04);
    color:rgba(255,255,255,0.75);
    font-family:inherit;
    font-weight:300;
    font-size:0.75rem;
    letter-spacing:0.08em;
    padding:8px 14px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }

  .time-picker__option:hover{
    border-color:rgba(255,255,255,0.45);
  }

  .time-picker__option.selected{
    background:rgba(255,255,255,0.85);
    color:rgba(10,10,10,0.85);
    border-color:rgba(255,255,255,0.85);
  }

  .time-picker__start{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.3);
    background:transparent;
    color:rgba(255,255,255,0.35);
    font-family:inherit;
    font-weight:300;
    font-size:0.78rem;
    letter-spacing:0.25em;
    padding:8px 26px;
    border-radius:999px;
    cursor:not-allowed;
    transition: all 0.4s ease;
  }

  .time-picker__start.enabled{
    color:rgba(255,255,255,0.95);
    border-color:rgba(255,255,255,0.7);
    cursor:pointer;
  }
  .time-picker__start.enabled:hover{
    background:rgba(255,255,255,0.12);
  }

  /* ============ 中央呼吸冥想气泡（Pixel Thoughts 致敬）============ */

  .meditation-layer{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:32px;
    opacity:0;
    pointer-events:none;
    transition: opacity 1.4s var(--ease-slow);
  }
  .meditation-layer.active{
    opacity:1;
    pointer-events:auto;
  }

  .breath-bubble{
    width:80px;
    height:80px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 35% 32%, rgba(255,255,255,0.4), rgba(255,255,255,0.05) 72%);
    border:1px solid rgba(255,255,255,0.4);
    animation-name: breathe;
    animation-iteration-count: infinite;
    animation-duration: 8s;   /* JS 会按用户调节的速率实时改写这个值 */
    will-change: transform, box-shadow;
  }

  /* 呼吸节奏做成不对称的：吸气（0%→42%）稍快，是主动的肌肉收缩；
     呼气（42%→100%）更长更缓，是被动的弹性回缩——
     这跟人真实呼吸时“吸气用力、呼气放松”的力学特征是一致的，
     配合每个关键帧各自的 easing，让扩张收缩的加减速也更接近有机的肺部运动，
     而不是机械对称的正弦波 */
  @keyframes breathe{
    0%   { transform:scale(1);    box-shadow:0 0 20px 4px rgba(255,255,255,0.14), 0 0 46px 14px rgba(255,255,255,0.05); animation-timing-function: cubic-bezier(0.45, 0, 0.4, 1); }
    42%  { transform:scale(1.85); box-shadow:0 0 60px 20px rgba(255,255,255,0.32), 0 0 120px 36px rgba(255,255,255,0.12); animation-timing-function: cubic-bezier(0.55, 0, 0.35, 1); }
    100% { transform:scale(1);    box-shadow:0 0 20px 4px rgba(255,255,255,0.14), 0 0 46px 14px rgba(255,255,255,0.05); }
  }

  .breath-bubble__text{
    font-weight:300;
    font-size:0.78rem;
    letter-spacing:0.15em;
    color:rgba(255,255,255,0.88);
    transition: opacity 0.6s ease;
    white-space:nowrap;
  }

  .breath-countdown{
    font-weight:300;
    font-size:0.72rem;
    letter-spacing:0.22em;
    color:rgba(255,255,255,0.38);
    font-variant-numeric: tabular-nums;
  }

  /* ============ 呼吸节奏手动调节 ============ */

  .breath-rate{
    display:flex;
    align-items:center;
    gap:14px;
    opacity:0.55;
    transition: opacity 0.3s ease;
  }
  .breath-rate:hover{
    opacity:0.95;
  }

  .breath-rate__btn{
    appearance:none;
    -webkit-appearance:none;
    background:transparent;
    border:1px solid rgba(255,255,255,0.28);
    color:rgba(255,255,255,0.8);
    width:26px;
    height:26px;
    border-radius:50%;
    font-size:0.85rem;
    line-height:1;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: background 0.35s ease, border-color 0.35s ease;
  }
  .breath-rate__btn:hover{
    background:rgba(255,255,255,0.14);
    border-color:rgba(255,255,255,0.55);
  }

  .breath-rate__value{
    font-size:0.62rem;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.5);
    font-variant-numeric: tabular-nums;
    min-width:84px;
    text-align:center;
  }

  .breath-hint{
    position:fixed;
    bottom:4.5vh;
    left:50%;
    transform:translateX(-50%);
    font-size:0.62rem;
    letter-spacing:0.12em;
    color:rgba(255,255,255,0.26);
    font-weight:300;
    white-space:nowrap;
  }

  /* ============ 移动端适配 ============ */

  @media (max-width: 640px){
    .brand{ top:6.5vh; left:6vw; }
    .brand__title{ font-size:1.05rem; }
    .brand__subtitle{ font-size:0.78rem; }
    .control-panel{ bottom:5vh; padding:8px 10px; gap:2px; }
    .scene-btn{ width:38px; height:38px; }
    .scene-btn__label{ display:none; } /* 触屏无 hover，隐藏文字气泡 */
    .time-picker{ bottom:calc(5vh + 66px); min-width:210px; }
    .support-panel{ bottom:calc(5vh + 66px); min-width:210px; }
  }

  /* 无障碍：尊重系统的“减少动态效果”偏好 */
  @media (prefers-reduced-motion: reduce){
    .ui-fade{ transition-duration: 0.2s !important; }
    .bg-video{ transition-duration: 0.2s !important; }
    .breath-bubble{ animation-duration: 12s; }
  }
</style>
</head>
<body>

  <!-- ============ 原生 HTML5 视频背景（已彻底移除 iframe，无第三方广告/跳转）============ -->
  <!-- poster 建议填一张与视频首帧接近的静态图（JPG，几十 KB 即可），
       浏览器会在视频真正解码出画面之前先瞬时显示这张图，切换观感会快很多 -->
  <video id="bg-video-1" class="bg-video" autoplay loop muted playsinline preload="auto"></video>
  <video id="bg-video-2" class="bg-video" autoplay loop muted playsinline preload="auto"></video>

  <!-- ============ 背景音乐（默认不自动播放，需用户手动点开）============ -->
  <!-- 两个 <audio> 交替使用，实现无缝交叉淡入淡出切歌，用法和背景视频完全对称 -->
  <audio id="bg-audio-1" preload="none"></audio>
  <audio id="bg-audio-2" preload="none"></audio>

  <div id="bg-veil"></div>
  <div id="bg-vignette"></div>

  <!-- ============ 界面层 ============ -->
  <div class="ui-layer">

    <!-- 左上角品牌文案 -->
    <div class="brand ui-fade">
      <div class="brand__title">高楼之巅 <span class="en">gaolou.org</span></div>
      <span class="brand__divider"></span>
      <div class="brand__subtitle">登高，望远，然后释怀。</div>
    </div>

    <!-- 下方毛玻璃控制面板 -->
    <div class="control-panel ui-fade" role="group" aria-label="切换风景与冥想">

      <button class="scene-btn" data-scene="chongqing" aria-label="魔幻重庆">
        <span class="scene-btn__label">魔幻重庆</span>
        <svg viewBox="0 0 24 24"><path d="M2 20h20M4 20V11l3-2.2 3 2.2v9M10 20V6.5l3-3 3 3V20M16 20v-8l3-2 2 2v8"/></svg>
      </button>

      <div class="panel-divider"></div>

      <button class="scene-btn" data-scene="shanghai" aria-label="都市上海">
        <span class="scene-btn__label">都市上海</span>
        <svg viewBox="0 0 24 24"><path d="M12 2.5v19M8.2 8h7.6M9 14.3h6M5.5 20.5h13"/><circle cx="12" cy="6" r="2"/><circle cx="12" cy="11" r="1.3"/></svg>
      </button>

      <div class="panel-divider"></div>

      <button class="scene-btn" data-scene="snowmountain" aria-label="治愈雪山">
        <span class="scene-btn__label">治愈雪山</span>
        <svg viewBox="0 0 24 24"><path d="M3 19.5L9.5 7l3 4.2 2-2.8 6.5 11.1H3Z"/><path d="M7.6 12.6l1.6 2.1M13.6 9.3l1.1 1.5"/></svg>
      </button>

      <div class="panel-divider"></div>

      <button class="scene-btn" data-scene="cyberpunk" aria-label="虚拟夜之城">
        <span class="scene-btn__label">虚拟夜之城</span>
        <svg viewBox="0 0 24 24"><path d="M2 20.5h20M4.5 20.5l3.5-9.5M19.5 20.5L16 11M8.7 20.5l1.7-5.2M15.3 20.5l-1.7-5.2M11 20.5V10M13 20.5V10"/></svg>
      </button>

      <div class="panel-divider"></div>

      <button class="scene-btn" id="meditateBtn" aria-label="云上发呆">
        <span class="scene-btn__label">云上发呆</span>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.6"/><circle cx="12" cy="12" r="6.4" stroke-opacity="0.55"/><circle cx="12" cy="12" r="10" stroke-opacity="0.28"/></svg>
      </button>

      <div class="panel-divider"></div>

      <button class="scene-btn" id="supportBtn" aria-label="支持我们">
        <span class="scene-btn__label">支持我们</span>
        <svg viewBox="0 0 24 24"><path d="M12 20.3S3.6 15 3.6 9.3C3.6 6.1 6 4 8.6 4c1.6 0 3.1.8 3.9 2.2C13.3 4.8 14.8 4 16.4 4c2.6 0 5 2.1 5 5.3 0 5.7-8.4 11-8.4 11z"/></svg>
      </button>

      <div class="panel-divider"></div>

      <button class="scene-btn" id="musicBtn" aria-label="背景音乐">
        <span class="scene-btn__label" id="musicLabel">背景音乐</span>
        <svg class="icon-music-off" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <line x1="16" y1="9" x2="21" y2="15"/>
          <line x1="21" y1="9" x2="16" y2="15"/>
        </svg>
        <svg class="icon-music-on" viewBox="0 0 24 24">
          <path d="M4 9v6h4l5 4V5L8 9H4z"/>
          <path d="M16 9a4 4 0 0 1 0 6"/>
          <path d="M18.5 6.5a8 8 0 0 1 0 11"/>
        </svg>
      </button>

    </div>

  </div>

  <!-- ============ 支持我们 · 赞助气泡菜单 ============ -->
  <div class="support-panel" id="supportPanel">
    <div class="support-panel__label">留下一份心意</div>
    <a class="support-panel__afdian" href="https://afdian.com/a/zhengyi98" target="_blank" rel="noopener noreferrer">
      爱发电 · 请我们喝杯茶
    </a>
  </div>

  <!-- ============ 冥想时长选择气泡菜单 ============ -->
  <div class="time-picker" id="timePicker">
    <div class="time-picker__label">留白多久</div>
    <div class="time-picker__options">
      <button class="time-picker__option" data-min="1">1 分钟</button>
      <button class="time-picker__option" data-min="3">3 分钟</button>
      <button class="time-picker__option" data-min="5">5 分钟</button>
    </div>
    <button class="time-picker__start" id="startMeditation">开始</button>
  </div>

  <!-- ============ 中央呼吸冥想层 ============ -->
  <div class="meditation-layer" id="meditationLayer" aria-hidden="true">
    <div class="breath-bubble" id="breathBubble">
      <span class="breath-bubble__text" id="breathText">吸气...</span>
    </div>
    <div class="breath-countdown" id="breathCountdown">00:00</div>

    <div class="breath-rate">
      <button class="breath-rate__btn" id="rateSlower" aria-label="呼吸慢一点">&minus;</button>
      <span class="breath-rate__value" id="rateValue">7.5 次/分钟</span>
      <button class="breath-rate__btn" id="rateFaster" aria-label="呼吸快一点">&plus;</button>
    </div>

    <div class="breath-hint">按 Esc 或双击屏幕，随时回到高楼之巅</div>
  </div>

<script>
(function(){

  // ============================================================
  // 1. 场景配置 —— 每个场景可以挂任意数量的视频，素材库大小完全灵活，
  //    往数组里加/删链接即可，不用碰下面的任何逻辑代码。
  //    每次切换到某个场景时会从对应数组里随机抽一条播放，
  //    且会避开"刚刚放过的那一条"，让老用户多次访问也不容易看腻。
  // ============================================================
  var SCENES = {
    chongqing: {
      name:'魔幻重庆',
      videos:[
        '/videos/chongqing-1.mp4',
        '/videos/chongqing-2.mp4',
        '/videos/chongqing-3.mp4'
        // 继续往下加即可，如 '/videos/chongqing-4.mp4', ...
      ]
    },
    shanghai: {
      name:'都市上海',
      videos:[
        '/videos/shanghai-1.mp4',
        '/videos/shanghai-2.mp4',
        '/videos/shanghai-3.mp4'
      ]
    },
    snowmountain: {
      name:'治愈雪山',
      videos:[
        '/videos/snowmountain-1.mp4',
        '/videos/snowmountain-2.mp4',
        '/videos/snowmountain-3.mp4'
      ]
    },
    cyberpunk: {
      name:'虚拟夜之城',
      videos:[
        '/videos/cyberpunk-1.mp4',
        '/videos/cyberpunk-2.mp4',
        '/videos/cyberpunk-3.mp4'
      ]
    }
  };

  var SCENE_KEYS = Object.keys(SCENES);
  // 每次打开网站，起始场景也随机挑一个分类，配合场景内随机选片，
  // 让"多次登录不觉得单调"从进站第一眼就成立
  var DEFAULT_SCENE = SCENE_KEYS[Math.floor(Math.random() * SCENE_KEYS.length)];

  // 记住每个场景上一次放过的是哪一条，抽取时尽量避开，减少"刚看过又是它"的重复感
  var lastPlayedIndex = {};

  // 数组里每一项既可以是纯字符串（只有视频地址），
  // 也可以写成 { src:'...mp4', poster:'...jpg' } 手动指定一张海报图；
  // 但更省心的是下面的“同名约定”：只要在视频同一目录放一张文件名相同、
  // 后缀是 .jpg 的图（比如 chongqing-1.mp4 配 chongqing-1.jpg），
  // 代码会自动探测到并优先使用，完全不用在这里手动写 poster 字段
  function normalizeEntry(entry){
    if (!entry) return null;
    if (typeof entry === 'string') return { src: entry, poster: '', srcLow: '' };
    return { src: entry.src, poster: entry.poster || '', srcLow: entry.srcLow || '' };
  }

  // 弱网自动降级（可选功能）：某个视频条目如果额外写了 srcLow 字段
  // （比如同一段素材导出的一个低码率/低分辨率版本），在检测到用户是
  // 慢网络（2g/3g）或开了"数据节省模式”时，会自动改用这个轻量版本。
  // 没有配置 srcLow 的条目完全不受影响，照常播放原来的 src
  function pickBestSrc(entry){
    var conn = navigator.connection || navigator.webkitConnection || navigator.mozConnection;
    if (entry.srcLow && conn){
      var isSlow = conn.saveData || (conn.effectiveType && /2g|3g/.test(conn.effectiveType));
      if (isSlow) return entry.srcLow;
    }
    return entry.src;
  }

  // 按“同名约定”推导海报图路径：/videos/chongqing-1.mp4 → /videos/chongqing-1.jpg
  function derivePosterPath(src){
    var m = src.match(/^(.*)\.[a-zA-Z0-9]+$/);
    return m ? (m[1] + '.jpg') : null;
  }

  function pickVideoSrc(key){
    var list = SCENES[key] && SCENES[key].videos;
    if (!list || !list.length) return null;
    if (list.length === 1) return normalizeEntry(list[0]);

    var idx;
    do {
      idx = Math.floor(Math.random() * list.length);
    } while (idx === lastPlayedIndex[key]);

    lastPlayedIndex[key] = idx;
    return normalizeEntry(list[idx]);
  }

  var videos = [document.getElementById('bg-video-1'), document.getElementById('bg-video-2')];
  var activeIndex = 0;
  var sceneButtons = document.querySelectorAll('.scene-btn[data-scene]');

  // 若视频源被防盗链拦截、404 或格式不支持，会在控制台给出明确诊断信息，
  // 而不是让页面无声无息地停留在纯黑背景上
  videos.forEach(function(v){
    v.addEventListener('error', function(){
      console.error(
        '[高楼之巅] 背景视频加载失败：' + (v.currentSrc || v.src) +
        '\n常见原因：1) 视频源开启了防盗链（Referer 校验），需自建托管；' +
        '2) 链接失效或跨域被拒绝；3) 网络无法访问该域名。'
      );
    });
  });

  // ============================================================
  // 2. 平滑无闪烁切换：双 <video> 交叉淡入淡出
  //    有海报图时立即显示（海报秒开，真实画面解码好后无缝替换）；
  //    没有海报图时退回“等 loadeddata/canplay 就绪再显示”的安全策略，
  //    两种情况都绝不会露出黑屏或闪烁
  // ============================================================
  function switchScene(key){
    var scene = SCENES[key];
    if (!scene) return;

    var picked = pickVideoSrc(key);
    if (!picked) return;
    var actualSrc = pickBestSrc(picked); // 可能因为弱网降级成 srcLow

    var activeVideo = videos[activeIndex];
    var nextIndex   = 1 - activeIndex;
    var nextVideo   = videos[nextIndex];
    var triggered   = false;
    var fallbackTimer = null;

    function reveal(){
      var playPromise = nextVideo.play();
      if (playPromise && playPromise.catch){
        playPromise.catch(function(err){
          console.warn('[高楼之巅] 视频播放被浏览器拦截或失败：', err, nextVideo.currentSrc);
        });
      }

      nextVideo.classList.add('active');
      activeVideo.classList.remove('active');
      activeIndex = nextIndex;

      // 等旧视频完全淡出（与 CSS 的 1.2s 过渡时间对应）后再暂停，节省性能
      setTimeout(function(){
        activeVideo.pause();
      }, 1300);
    }

    function onReady(){
      if (triggered) return;
      triggered = true;
      nextVideo.removeEventListener('loadeddata', onReady);
      nextVideo.removeEventListener('canplay', onReady);
      clearTimeout(fallbackTimer);
      reveal();
    }

    function gatedReveal(){
      // 双重监听：loadeddata（首帧可用）和 canplay（可流畅播放）任一先触发即可，
      // 避免某些浏览器/编码组合下 canplay 迟迟不触发导致画面卡在黑屏
      nextVideo.addEventListener('loadeddata', onReady);
      nextVideo.addEventListener('canplay', onReady);

      // 3 秒硬性兜底：即使两个事件都没等到，也强制显示，避免无限期黑屏
      fallbackTimer = setTimeout(function(){
        if (!triggered){
          console.warn('[高楼之巅] 视频 3 秒内未触发 loadeddata/canplay，已强制显示：', actualSrc);
        }
        onReady();
      }, 3000);
    }

    nextVideo.src = actualSrc;
    nextVideo.load();

    // 自动探测同名海报图：手动指定的 poster 优先，否则按“同名约定”推导，
    // 探测图片能加载出来才会“秒开”，加载失败就静默退回安全的等待模式，
    // 不会因为没有海报图而黑屏或报错
    var posterPath = picked.poster || derivePosterPath(picked.src);
    if (posterPath){
      var probe = new Image();
      probe.onload = function(){
        if (triggered) return;
        triggered = true;
        clearTimeout(fallbackTimer);
        nextVideo.poster = posterPath;
        reveal();
      };
      probe.onerror = function(){
        console.warn('[高楼之巅] 海报图未找到或加载失败，已退回等待视频就绪的模式：', posterPath);
        nextVideo.removeAttribute('poster');
        gatedReveal();
      };
      probe.src = posterPath;
    } else {
      gatedReveal();
    }

    sceneButtons.forEach(function(btn){
      btn.classList.toggle('active', btn.dataset.scene === key);
    });
  }

  sceneButtons.forEach(function(btn){
    btn.addEventListener('click', function(){
      switchScene(btn.dataset.scene);
    });
  });

  switchScene(DEFAULT_SCENE);

  // 浏览器空闲时，把其余几个分类各预取一条视频的字节缓存到本地，
  // 之后用户点击那些按钮时大概率直接命中缓存，切换会明显更快。
  // 只预取“一条”而不是全部素材库，避免无谓占用用户的移动网络流量
  function prefetchOtherScenes(currentKey){
    SCENE_KEYS.forEach(function(k){
      if (k === currentKey) return;
      var list = SCENES[k] && SCENES[k].videos;
      if (!list || !list.length) return;
      var entry = normalizeEntry(list[0]);
      var link = document.createElement('link');
      link.rel = 'prefetch';
      link.as = 'video';
      link.href = entry.src;
      document.head.appendChild(link);
    });
  }

  if (window.requestIdleCallback){
    requestIdleCallback(function(){ prefetchOtherScenes(DEFAULT_SCENE); });
  } else {
    setTimeout(function(){ prefetchOtherScenes(DEFAULT_SCENE); }, 2000);
  }

  // ============================================================
  // 3. 智能隐形逻辑（鼠标静止 3 秒自动隐藏）
  // ============================================================
  var hideTimer = null;
  var HIDE_DELAY = 3000;

  function wake(){
    // 冥想模式下彻底冻结此逻辑：无论怎样移动鼠标，界面都绝不重新出现
    if (document.body.classList.contains('meditating')) return;

    document.body.classList.add('ui-visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
      document.body.classList.remove('ui-visible');
    }, HIDE_DELAY);
  }

  ['mousemove', 'mousedown', 'touchstart', 'touchmove', 'keydown', 'wheel'].forEach(function(evt){
    window.addEventListener(evt, wake, { passive:true });
  });

  wake();

  window.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // ============================================================
  // 背景音乐：像视频一样支持“素材库 + 随机播放”，用双 <audio> 交叉淡入淡出
  // 实现无缝切歌，一首快放完时提前切下一首，不会有静音空隙。
  // 默认不自动播放（浏览器策略也不允许带声音的音频自动播放），需要用户主动点开。
  // 曲库大小完全灵活，往数组里加/删链接即可
  // ============================================================
  var AUDIO_TRACKS = [
    '/audio/ambient-1.mp3',
    '/audio/ambient-2.mp3',
    '/audio/ambient-3.mp3'
    // 继续往下加即可
  ];
  var CROSSFADE_SECONDS = 2.5;
  var TARGET_VOLUME = 0.35;

  var audios = [document.getElementById('bg-audio-1'), document.getElementById('bg-audio-2')];
  var activeAudioIndex = 0;
  var lastAudioTrack = null;
  var musicBtn = document.getElementById('musicBtn');
  var musicOn  = false;
  var audioPrefetched = false;

  function pickTrack(){
    if (!AUDIO_TRACKS.length) return null;
    if (AUDIO_TRACKS.length === 1) return AUDIO_TRACKS[0];
    var idx;
    do {
      idx = Math.floor(Math.random() * AUDIO_TRACKS.length);
    } while (AUDIO_TRACKS[idx] === lastAudioTrack);
    lastAudioTrack = AUDIO_TRACKS[idx];
    return AUDIO_TRACKS[idx];
  }

  function fadeVolume(el, from, to, duration, done){
    var start = null;
    function step(ts){
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / duration);
      el.volume = from + (to - from) * p;
      if (p < 1){
        requestAnimationFrame(step);
      } else if (done){
        done();
      }
    }
    requestAnimationFrame(step);
  }

  // 监听当前播放曲目的剩余时间，快放完时提前触发交叉切歌，避免留白静音
  function watchForCrossfade(el){
    function onTimeUpdate(){
      if (!musicOn){ return; }
      if (el.duration && (el.duration - el.currentTime) <= CROSSFADE_SECONDS){
        el.removeEventListener('timeupdate', onTimeUpdate);
        crossfadeToNextTrack();
      }
    }
    el.addEventListener('timeupdate', onTimeUpdate);
  }

  function crossfadeToNextTrack(){
    if (!musicOn) return;
    var current    = audios[activeAudioIndex];
    var nextIndex  = 1 - activeAudioIndex;
    var next       = audios[nextIndex];
    var track      = pickTrack();
    if (!track) return;

    next.src = track;
    next.load();
    next.addEventListener('canplay', function onReady(){
      next.removeEventListener('canplay', onReady);
      next.volume = 0;
      var p = next.play();
      if (p && p.catch){ p.catch(function(err){ console.warn('[高楼之巅] 背景音乐播放失败：', err); }); }
      fadeVolume(next, 0, TARGET_VOLUME, CROSSFADE_SECONDS * 1000);
      fadeVolume(current, current.volume, 0, CROSSFADE_SECONDS * 1000, function(){ current.pause(); });
      activeAudioIndex = nextIndex;
      watchForCrossfade(next);
    }, { once:true });
  }

  // 浏览器空闲时预取曲库里剩下的曲目字节，第一次切歌时大概率已经在缓存里，不会有加载延迟
  function prefetchRemainingTracks(){
    if (audioPrefetched) return;
    audioPrefetched = true;
    AUDIO_TRACKS.forEach(function(src){
      if (src === lastAudioTrack) return;
      var link = document.createElement('link');
      link.rel = 'prefetch';
      link.as = 'audio';
      link.href = src;
      document.head.appendChild(link);
    });
  }

  musicBtn.addEventListener('click', function(){
    musicOn = !musicOn;
    musicBtn.classList.toggle('active', musicOn);

    if (musicOn){
      var el = audios[activeAudioIndex];
      var track = pickTrack();
      if (!track) return;
      el.src = track;
      el.load();
      el.addEventListener('canplay', function onReady(){
        el.removeEventListener('canplay', onReady);
        el.volume = 0;
        var p = el.play();
        if (p && p.catch){ p.catch(function(err){ console.warn('[高楼之巅] 背景音乐播放被浏览器拦截或失败：', err); }); }
        fadeVolume(el, 0, TARGET_VOLUME, 1200);
        watchForCrossfade(el);
      }, { once:true });

      // 用户主动开了音乐，说明确实需要，这时候再去预取曲库其余曲目最划算，
      // 不打扰从没打开过音乐的访客的流量
      if (window.requestIdleCallback){
        requestIdleCallback(prefetchRemainingTracks);
      } else {
        setTimeout(prefetchRemainingTracks, 1500);
      }
    } else {
      var current = audios[activeAudioIndex];
      fadeVolume(current, current.volume, 0, 800, function(){
        audios.forEach(function(a){ a.pause(); });
      });
    }
  });

  audios.forEach(function(a){
    a.addEventListener('error', function(){
      console.error(
        '[高楼之巅] 背景音乐加载失败：' + (a.currentSrc || a.src) +
        '\n请确认音频文件已放进 public/audio/ 目录，且代码里 AUDIO_TRACKS 里的路径与真实文件名完全一致。'
      );
    });
  });

  // ============================================================
  // 4. 云上发呆 —— 时长选择气泡菜单 ｜ 支持我们 —— 赞助气泡菜单
  //    两个气泡菜单共用同一套“互斥展开、点外部收起”的逻辑
  // ============================================================
  var meditateBtn   = document.getElementById('meditateBtn');
  var timePicker    = document.getElementById('timePicker');
  var durationBtns  = document.querySelectorAll('.time-picker__option');
  var startBtn      = document.getElementById('startMeditation');

  var supportBtn    = document.getElementById('supportBtn');
  var supportPanel  = document.getElementById('supportPanel');

  var selectedMinutes = null;

  function closeTimePicker(){
    timePicker.classList.remove('open');
    meditateBtn.classList.remove('active');
  }
  function closeSupportPanel(){
    supportPanel.classList.remove('open');
    supportBtn.classList.remove('active');
  }

  meditateBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willOpen = !timePicker.classList.contains('open');
    closeSupportPanel();
    timePicker.classList.toggle('open', willOpen);
    meditateBtn.classList.toggle('active', willOpen);
  });

  supportBtn.addEventListener('click', function(e){
    e.stopPropagation();
    var willOpen = !supportPanel.classList.contains('open');
    closeTimePicker();
    supportPanel.classList.toggle('open', willOpen);
    supportBtn.classList.toggle('active', willOpen);
  });

  durationBtns.forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      durationBtns.forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      selectedMinutes = parseInt(btn.dataset.min, 10);
      startBtn.classList.add('enabled');
    });
  });

  startBtn.addEventListener('click', function(e){
    e.stopPropagation();
    if (!selectedMinutes) return;
    closeTimePicker();
    startMeditation(selectedMinutes);
  });

  // 点击任一气泡菜单以外的区域，优雅收起（两个菜单共用这一套判断）
  document.addEventListener('click', function(e){
    if (timePicker.classList.contains('open') &&
        !timePicker.contains(e.target) &&
        !meditateBtn.contains(e.target)){
      closeTimePicker();
    }
    if (supportPanel.classList.contains('open') &&
        !supportPanel.contains(e.target) &&
        !supportBtn.contains(e.target)){
      closeSupportPanel();
    }
  });

  // ============================================================
  // 5. 进入冥想（开启精神留白）—— 呼吸引导气泡
  // ============================================================
  var meditationLayer = document.getElementById('meditationLayer');
  var breathText       = document.getElementById('breathText');
  var breathBubble     = document.getElementById('breathBubble');
  var breathCountdown  = document.getElementById('breathCountdown');
  var rateSlowerBtn    = document.getElementById('rateSlower');
  var rateFasterBtn    = document.getElementById('rateFaster');
  var rateValueLabel   = document.getElementById('rateValue');

  var countdownTimer  = null;
  var breathPhaseTimer = null;
  var remainingSeconds = 0;

  // 一次完整呼吸（吸气+呼气）的总时长，单位秒；吸气占 INHALE_RATIO，
  // 呼气占剩下的部分——呼气比吸气长，是刻意的：更长的呼气对应更放松的
  // 副交感神经反应，这也是"呼气...释怀..."想传达的感觉
  var breathPeriod  = 8;
  var INHALE_RATIO  = 0.42;
  var MIN_PERIOD    = 5;
  var MAX_PERIOD    = 14;

  function bpmLabel(period){
    return (60 / period).toFixed(1) + ' 次/分钟';
  }

  function applyBreathRate(){
    rateValueLabel.textContent = bpmLabel(breathPeriod);
    breathBubble.style.animationDuration = breathPeriod + 's';
  }

  // 让 CSS 里的 scale 动画从头重新开始播放，跟下面 JS 排的文字节奏对齐
  function restartBubbleAnimation(){
    breathBubble.style.animation = 'none';
    void breathBubble.offsetWidth; // 强制重排，这一行不能删
    breathBubble.style.animation = '';
    applyBreathRate();
  }

  function startMeditation(minutes){
    remainingSeconds = minutes * 60;
    updateCountdownDisplay();

    // 5.1 主界面在 1 秒内彻底冻结、淡出（由 body.meditating 的 CSS 强制接管）
    closeSupportPanel();
    document.body.classList.add('meditating');
    document.body.classList.remove('ui-visible');
    clearTimeout(hideTimer);

    // 5.2 短暂停顿后，呼吸气泡缓缓浮现，强化仪式感
    setTimeout(function(){
      meditationLayer.classList.add('active');
      restartBubbleAnimation();
      scheduleBreathPhase(true);
    }, 650);

    countdownTimer = setInterval(function(){
      remainingSeconds--;
      updateCountdownDisplay();
      if (remainingSeconds <= 0){
        endMeditation();
      }
    }, 1000);
  }

  // 按吸气/呼气各自的时长递归排程，文字切换的时刻精确对应气泡放大到顶/缩回底的时刻，
  // 而不是像固定 setInterval 那样跟动画各走各的
  function scheduleBreathPhase(isInhale){
    breathText.textContent = isInhale ? '吸气...' : (Math.random() > 0.5 ? '呼气...' : '释怀...');
    breathText.style.opacity = '1';

    var phaseMs = (isInhale ? INHALE_RATIO : (1 - INHALE_RATIO)) * breathPeriod * 1000;
    var fadeLead = 300; // 提前 300ms 开始文字淡出，让切换看起来更顺滑，不生硬

    breathPhaseTimer = setTimeout(function(){
      breathText.style.opacity = '0';
      setTimeout(function(){
        scheduleBreathPhase(!isInhale);
      }, fadeLead);
    }, Math.max(300, phaseMs - fadeLead));
  }

  function changeBreathRate(deltaSeconds){
    breathPeriod = Math.min(MAX_PERIOD, Math.max(MIN_PERIOD, breathPeriod + deltaSeconds));
    restartBubbleAnimation();
    clearTimeout(breathPhaseTimer);
    scheduleBreathPhase(true); // 从吸气重新起一轮，避免调整瞬间画面和文字对不上
  }

  rateSlowerBtn.addEventListener('click', function(e){
    e.stopPropagation();
    changeBreathRate(1); // 周期变长 = 呼吸变慢
  });
  rateFasterBtn.addEventListener('click', function(e){
    e.stopPropagation();
    changeBreathRate(-1); // 周期变短 = 呼吸变快
  });

  function updateCountdownDisplay(){
    var m = Math.floor(remainingSeconds / 60);
    var s = remainingSeconds % 60;
    breathCountdown.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ============================================================
  // 6. 优雅退出：倒计时结束 / Esc / 手机双击
  // ============================================================
  function endMeditation(){
    clearInterval(countdownTimer);
    clearTimeout(breathPhaseTimer);
    countdownTimer = null;
    breathPhaseTimer = null;

    meditationLayer.classList.remove('active');

    setTimeout(function(){
      document.body.classList.remove('meditating');
      selectedMinutes = null;
      durationBtns.forEach(function(b){ b.classList.remove('selected'); });
      startBtn.classList.remove('enabled');
      wake(); // 解冻并重新激活鼠标静止淡出监听，无缝回到隐形状态
    }, 1200);
  }

  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.body.classList.contains('meditating')){
      endMeditation();
    }
  });

  var lastTap = 0;
  meditationLayer.addEventListener('touchend', function(){
    var now = Date.now();
    if (now - lastTap < 350 && document.body.classList.contains('meditating')){
      endMeditation();
    }
    lastTap = now;
  });

})();
</script>

</body>
</html>
