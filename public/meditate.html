<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>云上发呆 | 高楼之巅</title>
<meta name="description" content="登高，望远，然后释怀。一段跟随呼吸节奏的引导，或一次安静的沉思阅读。">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet">

<style>
  :root{
    --ease-slow: cubic-bezier(0.22, 1, 0.36, 1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{
    width:100%; height:100%;
    overflow:hidden;
    background: radial-gradient(ellipse at 50% 40%, #1b212c 0%, #0a0c10 65%, #050608 100%);
    font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    color: rgba(255,255,255,0.85);
  }

  /* ============ 背景：单张静态图，由首页跳转时通过 ?bg= 带过来 ============ */

  #bg-image{
    position:fixed;
    top:0; left:0;
    width:100vw; height:100vh;
    object-fit:cover;
    z-index:0;
    pointer-events:none;
    user-select:none;
    background:#000;
  }

  #bg-veil{
    position:fixed;
    inset:0;
    z-index:1;
    pointer-events:none;
    background: rgba(0,0,0,0.5);
  }

  #bg-vignette{
    position:fixed;
    inset:0;
    z-index:2;
    pointer-events:none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.4) 100%);
  }

  /* ============ 左上角：返回首页 + 品牌标记 ============ */

  .top-bar{
    position:fixed;
    top:5vh;
    left:5.5vw;
    z-index:20;
    display:flex;
    align-items:center;
    gap:16px;
  }

  .back-link{
    font-size:0.78rem;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.55);
    text-decoration:none;
    border-bottom:1px solid rgba(255,255,255,0.2);
    padding-bottom:2px;
    transition: color 0.4s ease, border-color 0.4s ease;
  }
  .back-link:hover{
    color:rgba(255,255,255,0.9);
    border-color:rgba(255,255,255,0.6);
  }

  .brand-mark{
    font-weight:300;
    font-size:0.85rem;
    letter-spacing:0.14em;
    color:rgba(255,255,255,0.4);
  }

  /* ============ 选择器：模式 + 时长 ============ */

  .picker{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    z-index:10;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:26px;
    opacity:1;
    transition: opacity 0.8s ease;
  }
  .picker.hide{
    opacity:0;
    pointer-events:none;
  }

  .picker__title{
    font-weight:300;
    font-size:1.1rem;
    letter-spacing:0.2em;
    color:rgba(255,255,255,0.85);
  }

  .picker__modes{
    display:flex;
    gap:10px;
  }
  .picker__mode{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.05);
    color:rgba(255,255,255,0.75);
    font-family:inherit;
    font-weight:300;
    font-size:0.85rem;
    letter-spacing:0.1em;
    padding:10px 22px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }
  .picker__mode:hover{ border-color:rgba(255,255,255,0.5); }
  .picker__mode.active{
    background:rgba(255,255,255,0.88);
    color:rgba(10,10,10,0.85);
    border-color:rgba(255,255,255,0.88);
  }

  .picker__options{
    display:flex;
    gap:10px;
  }
  .picker__option{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.22);
    background:rgba(255,255,255,0.04);
    color:rgba(255,255,255,0.7);
    font-family:inherit;
    font-weight:300;
    font-size:0.8rem;
    letter-spacing:0.06em;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease, color 0.4s ease;
  }
  .picker__option:hover{ border-color:rgba(255,255,255,0.45); }
  .picker__option.selected{
    background:rgba(255,255,255,0.85);
    color:rgba(10,10,10,0.85);
    border-color:rgba(255,255,255,0.85);
  }

  .picker__start{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.35);
    background:transparent;
    color:rgba(255,255,255,0.35);
    font-family:inherit;
    font-weight:300;
    font-size:0.85rem;
    letter-spacing:0.3em;
    padding:10px 34px;
    border-radius:999px;
    cursor:not-allowed;
    transition: all 0.4s ease;
  }
  .picker__start.enabled{
    color:rgba(255,255,255,0.95);
    border-color:rgba(255,255,255,0.75);
    cursor:pointer;
  }
  .picker__start.enabled:hover{
    background:rgba(255,255,255,0.12);
  }

  /* ============ 冥想层：跟原来 index.html 里的实现完全一致 ============ */

  .meditation-layer{
    position:fixed;
    inset:0;
    z-index:15;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:32px;
    opacity:0;
    pointer-events:none;
    transition: opacity 1.4s var(--ease-slow);
  }
  .meditation-layer.active{
    opacity:1;
    pointer-events:auto;
  }

  .breath-bubble{
    width:80px;
    height:80px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background: radial-gradient(circle at 35% 32%, rgba(255,255,255,0.4), rgba(255,255,255,0.05) 72%);
    border:1px solid rgba(255,255,255,0.4);
    animation-name: breathe;
    animation-iteration-count: infinite;
    animation-duration: 8s;
    will-change: transform, box-shadow;
  }

  @keyframes breathe{
    0%   { transform:scale(1);    box-shadow:0 0 20px 4px rgba(255,255,255,0.14), 0 0 46px 14px rgba(255,255,255,0.05); animation-timing-function: cubic-bezier(0.45, 0, 0.4, 1); }
    42%  { transform:scale(1.85); box-shadow:0 0 60px 20px rgba(255,255,255,0.32), 0 0 120px 36px rgba(255,255,255,0.12); animation-timing-function: cubic-bezier(0.55, 0, 0.35, 1); }
    100% { transform:scale(1);    box-shadow:0 0 20px 4px rgba(255,255,255,0.14), 0 0 46px 14px rgba(255,255,255,0.05); }
  }

  .breath-bubble__text{
    font-weight:300;
    font-size:0.78rem;
    letter-spacing:0.15em;
    color:rgba(255,255,255,0.88);
    transition: opacity 0.6s ease;
    white-space:nowrap;
  }

  .contemplation-glow{
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(255,255,255,0.9);
    box-shadow: 0 0 30px 10px rgba(255,255,255,0.25), 0 0 60px 20px rgba(255,255,255,0.1);
    animation: contemplationPulse 9s ease-in-out infinite;
    display:none;
  }
  @keyframes contemplationPulse{
    0%   { opacity:0.35; transform:scale(1); }
    50%  { opacity:1;    transform:scale(1.4); }
    100% { opacity:0.35; transform:scale(1); }
  }
  .meditation-layer.mode-contemplate .breath-bubble,
  .meditation-layer.mode-contemplate #breathRateControl{
    display:none;
  }
  .meditation-layer.mode-contemplate .contemplation-glow{
    display:block;
  }

  .breath-countdown{
    font-weight:300;
    font-size:0.72rem;
    letter-spacing:0.22em;
    color:rgba(255,255,255,0.38);
    font-variant-numeric: tabular-nums;
  }

  .breath-rate{
    display:flex;
    align-items:center;
    gap:14px;
    opacity:0.55;
    transition: opacity 0.3s ease;
  }
  .breath-rate:hover{ opacity:0.95; }
  .breath-rate__btn{
    appearance:none;
    -webkit-appearance:none;
    background:transparent;
    border:1px solid rgba(255,255,255,0.28);
    color:rgba(255,255,255,0.8);
    width:26px; height:26px;
    border-radius:50%;
    font-size:0.85rem;
    line-height:1;
    font-family:inherit;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background 0.35s ease, border-color 0.35s ease;
  }
  .breath-rate__btn:hover{
    background:rgba(255,255,255,0.14);
    border-color:rgba(255,255,255,0.55);
  }
  .breath-rate__value{
    font-size:0.62rem;
    letter-spacing:0.1em;
    color:rgba(255,255,255,0.5);
    font-variant-numeric: tabular-nums;
    min-width:84px;
    text-align:center;
  }

  .breath-poem{
    opacity:0;
    pointer-events:none;
    transition: opacity 1.6s var(--ease-slow);
    text-align:center;
    max-width:78vw;
  }
  .breath-poem__line{
    font-weight:300;
    font-size:1.05rem;
    letter-spacing:0.14em;
    line-height:2;
    color:rgba(255,255,255,0.92);
    text-shadow: 0 1px 16px rgba(0,0,0,0.4);
  }
  .breath-poem__author{
    margin-top:12px;
    font-size:0.66rem;
    letter-spacing:0.22em;
    color:rgba(255,255,255,0.4);
  }

  .contemplation-closing{
    opacity:0;
    pointer-events:none;
    transition: opacity 1.6s var(--ease-slow);
    text-align:center;
    max-width:66vw;
    font-weight:300;
    font-size:0.92rem;
    letter-spacing:0.05em;
    line-height:1.9;
    color:rgba(255,255,255,0.75);
    text-shadow: 0 1px 12px rgba(0,0,0,0.35);
  }

  .meditation-layer.finale .breath-bubble,
  .meditation-layer.finale .breath-countdown,
  .meditation-layer.finale .breath-rate,
  .meditation-layer.finale .contemplation-glow{
    opacity:0;
    transition: opacity 1s ease;
  }
  .meditation-layer.finale .breath-poem{ opacity:1; }
  .meditation-layer.mode-contemplate.finale .breath-poem{ opacity:0; }
  .meditation-layer.mode-contemplate.finale .contemplation-closing{ opacity:1; }

  .breath-hint{
    position:fixed;
    bottom:4.5vh;
    left:50%;
    transform:translateX(-50%);
    font-size:0.62rem;
    letter-spacing:0.12em;
    color:rgba(255,255,255,0.26);
    font-weight:300;
    white-space:nowrap;
    z-index:16;
    opacity:0;
    transition: opacity 1s ease;
  }
  .breath-hint.show{ opacity:1; }

  .meditation-cue{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    z-index:16;
    font-weight:300;
    font-size:0.9rem;
    letter-spacing:0.16em;
    color:rgba(255,255,255,0.75);
    text-align:center;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition: opacity 1s ease;
  }
  .meditation-cue.show{ opacity:1; }

  .mindfulness-prompt{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    z-index:16;
    font-weight:300;
    font-size:1rem;
    letter-spacing:0.1em;
    line-height:2;
    color:rgba(255,255,255,0.82);
    text-align:center;
    max-width:66vw;
    text-shadow: 0 1px 14px rgba(0,0,0,0.35);
    opacity:0;
    pointer-events:none;
    transition: opacity 1.1s ease;
  }
  .mindfulness-prompt.show{ opacity:1; }

  .contemplation-intro{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%, -50%);
    z-index:16;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:30px;
    max-width:60vw;
    opacity:0;
    pointer-events:none;
    transition: opacity 1.3s ease;
  }
  .contemplation-intro.show{
    opacity:1;
    pointer-events:auto;
  }
  .contemplation-theme{
    font-weight:300;
    font-size:1.4rem;
    letter-spacing:0.32em;
    color:rgba(255,255,255,0.92);
    text-shadow: 0 1px 16px rgba(0,0,0,0.4);
  }
  .contemplation-passage{
    font-weight:300;
    font-size:1rem;
    letter-spacing:0.08em;
    line-height:2.3;
    color:rgba(255,255,255,0.8);
    text-align:center;
    white-space:pre-line;
    text-shadow: 0 1px 14px rgba(0,0,0,0.35);
  }
  .contemplation-begin{
    appearance:none;
    -webkit-appearance:none;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.08);
    color:rgba(255,255,255,0.92);
    font-family:inherit;
    font-weight:300;
    font-size:0.8rem;
    letter-spacing:0.16em;
    padding:10px 30px;
    border-radius:999px;
    cursor:pointer;
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  .contemplation-begin:hover{
    background:rgba(255,255,255,0.16);
    border-color:rgba(255,255,255,0.75);
  }

  body.meditating .top-bar,
  body.meditating .picker{
    opacity:0 !important;
    pointer-events:none !important;
    transition: opacity 1s var(--ease-slow) !important;
  }
  body.meditating{ cursor:none; }

  @media (max-width: 640px){
    .top-bar{ top:6vh; left:6vw; }
    .contemplation-intro{ max-width:84vw; }
    .contemplation-passage{ font-size:0.92rem; }
    .contemplation-theme{ font-size:1.2rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .picker, .meditation-layer, .breath-hint, .meditation-cue,
    .mindfulness-prompt, .contemplation-intro{ transition-duration: 0.2s !important; }
    .breath-bubble{ animation-duration: 12s; }
  }
</style>

<body>

  <img id="bg-image" alt="">
  <div id="bg-veil"></div>
  <div id="bg-vignette"></div>

  <div class="top-bar">
    <a class="back-link" href="/">&larr; 回到高楼之巅</a>
    <span class="brand-mark">云上发呆</span>
  </div>

  <div class="picker" id="picker">
    <div class="picker__title">选一种方式</div>
    <div class="picker__modes">
      <button class="picker__mode active" id="modeBreath" data-mode="breath">释怀</button>
      <button class="picker__mode" id="modeContemplate" data-mode="contemplate">望远</button>
    </div>
    <div class="picker__options">
      <button class="picker__option" data-min="1">1 分钟</button>
      <button class="picker__option" data-min="3">3 分钟</button>
      <button class="picker__option" data-min="5">5 分钟</button>
    </div>
    <button class="picker__start" id="startBtn">开始</button>
  </div>

  <div class="meditation-cue" id="meditationCue">找一个能坐直的姿势</div>
  <div class="mindfulness-prompt" id="mindfulnessPrompt"></div>

  <div class="contemplation-intro" id="contemplationIntro">
    <div class="contemplation-theme" id="contemplationTheme"></div>
    <div class="contemplation-passage" id="contemplationPassage"></div>
    <button class="contemplation-begin" id="contemplationBegin">我准备好了</button>
  </div>

  <div class="meditation-layer" id="meditationLayer" aria-hidden="true">
    <div class="breath-bubble" id="breathBubble">
      <span class="breath-bubble__text" id="breathText">吸气...</span>
    </div>
    <div class="contemplation-glow" id="contemplationGlow"></div>

    <div class="breath-countdown" id="breathCountdown">00:00</div>

    <div class="breath-rate" id="breathRateControl">
      <button class="breath-rate__btn" id="rateSlower" aria-label="呼吸慢一点">&minus;</button>
      <span class="breath-rate__value" id="rateValue">7.5 次/分钟</span>
      <button class="breath-rate__btn" id="rateFaster" aria-label="呼吸快一点">&plus;</button>
    </div>

    <div class="breath-poem" id="breathPoem">
      <div class="breath-poem__line" id="poemLine"></div>
      <div class="breath-poem__author" id="poemAuthor"></div>
    </div>
    <div class="contemplation-closing" id="contemplationClosing"></div>
  </div>

  <div class="breath-hint" id="breathHint">按 Esc 或双击屏幕，随时回到高楼之巅</div>

<script>
(function(){

  // ============================================================
  // 背景：从首页跳转过来时会带一个 ?bg= 参数，指向用户刚才正在看的那张图，
  // 保持视觉连续性；没有这个参数（比如直接访问本页）就用默认图兜底
  // ============================================================
  var bgImage = document.getElementById('bg-image');
  var params = new URLSearchParams(window.location.search);
  var bgParam = params.get('bg');
  bgImage.src = bgParam ? decodeURIComponent(bgParam) : '/hero-cover.jpg';
  bgImage.addEventListener('error', function(){
    bgImage.src = '/hero-cover.jpg'; // 传过来的路径万一失效，退回默认图，不会黑屏
  });

  // ============================================================
  // 模式 + 时长选择
  // ============================================================
  var picker = document.getElementById('picker');
  var modeBreathBtn = document.getElementById('modeBreath');
  var modeContemplateBtn = document.getElementById('modeContemplate');
  var durationBtns = document.querySelectorAll('.picker__option');
  var startBtn = document.getElementById('startBtn');

  var practiceMode = 'breath';
  var selectedMinutes = null;

  modeBreathBtn.addEventListener('click', function(){
    practiceMode = 'breath';
    modeBreathBtn.classList.add('active');
    modeContemplateBtn.classList.remove('active');
  });
  modeContemplateBtn.addEventListener('click', function(){
    practiceMode = 'contemplate';
    modeContemplateBtn.classList.add('active');
    modeBreathBtn.classList.remove('active');
  });

  durationBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      durationBtns.forEach(function(b){ b.classList.remove('selected'); });
      btn.classList.add('selected');
      selectedMinutes = parseInt(btn.dataset.min, 10);
      startBtn.classList.add('enabled');
    });
  });

  startBtn.addEventListener('click', function(){
    if (!selectedMinutes) return;
    picker.classList.add('hide');
    if (practiceMode === 'contemplate'){
      startContemplation(selectedMinutes);
    } else {
      startMeditation(selectedMinutes);
    }
  });

  // ============================================================
  // 内容池：诗句 / 正念提示 / 望远短文——跟 index.html 里原来的一字不差
  // ============================================================
  var POEMS = [
    { line:'欲穷千里目，更上一层楼。', author:'王之涣 · 登鹳雀楼' },
    { line:'行到水穷处，坐看云起时。', author:'王维 · 终南别业' },
    { line:'起舞弄清影，何似在人间。', author:'苏轼 · 水调歌头' },
    { line:'相看两不厌，只有敬亭山。', author:'李白 · 独坐敬亭山' },
    { line:'不畏浮云遮望眼，只缘身在最高层。', author:'王安石 · 登飞来峰' },
    { line:'会当凌绝顶，一览众山小。', author:'杜甫 · 望岳' }
  ];
  var lastPoemIndex = null;
  function pickPoem(){
    if (POEMS.length === 1) return POEMS[0];
    var idx;
    do { idx = Math.floor(Math.random() * POEMS.length); } while (idx === lastPoemIndex);
    lastPoemIndex = idx;
    return POEMS[idx];
  }

  var MINDFULNESS_PROMPTS = [
    '此刻，你不必是任何人，只是坐着。',
    '留意呼吸经过鼻尖的凉意，仅此而已。',
    '念头来了又走，不必追，也不必赶。',
    '把注意力交给此刻，交给这一秒。',
    '身体在这里，心也可以在这里。',
    '不必抵达哪里，停留本身就是完整的。'
  ];
  var lastPromptIndex = null;
  function pickMindfulnessPrompt(){
    if (MINDFULNESS_PROMPTS.length === 1) return MINDFULNESS_PROMPTS[0];
    var idx;
    do { idx = Math.floor(Math.random() * MINDFULNESS_PROMPTS.length); } while (idx === lastPromptIndex);
    lastPromptIndex = idx;
    return MINDFULNESS_PROMPTS[idx];
  }

  var PASSAGES = [
    { theme:'接纳', passage:'你不需要立刻变得更好。\n允许自己，只是停在这里。\n呼吸会自己完成它的工作，\n你只需要，不去打扰它。', closing:'今天，允许自己有一件事，做得不够好。' },
    { theme:'放下', passage:'有些念头，不必收留它们过夜。\n让它们经过，像云经过山头，\n不留痕迹，也没关系。', closing:'回到日常后，试着对一件小事说：这次，我不接了。' },
    { theme:'临在', passage:'此刻你所在的地方，\n就是唯一需要抵达的地方。\n不必去想接下来做什么，\n接下来，会自己到来。', closing:'下一次走神时，只需轻轻问自己：我现在，在哪里？' },
    { theme:'渺小', passage:'高处的风，吹不散所有烦恼，\n却能让你看清，它们有多小。\n你不是被困住了，\n你只是，还没往上走一层。', closing:'把那件让你烦心的事，想象成脚下的一栋楼，而不是整座城市。' },
    { theme:'安静', passage:'安静不是没有声音，\n是你不再急着回应什么。\n给自己一点时间，\n什么都不做，也是一种完成。', closing:'接下来一小时，试着晚一点回复，而不是立刻。' },
    { theme:'卸下', passage:'你带着一整天的重量走到这里。\n现在，可以把它们，\n暂时放在门口。', closing:'离开这里之后，那些重量，你可以选择只拿回一部分。' }
  ];
  var lastPassageIndex = null;
  function pickPassage(){
    if (PASSAGES.length === 1) return PASSAGES[0];
    var idx;
    do { idx = Math.floor(Math.random() * PASSAGES.length); } while (idx === lastPassageIndex);
    lastPassageIndex = idx;
    return PASSAGES[idx];
  }

  // ============================================================
  // 呼吸（释怀）模式
  // ============================================================
  var meditationLayer = document.getElementById('meditationLayer');
  var meditationCue = document.getElementById('meditationCue');
  var mindfulnessPrompt = document.getElementById('mindfulnessPrompt');
  var breathText = document.getElementById('breathText');
  var breathBubble = document.getElementById('breathBubble');
  var breathCountdown = document.getElementById('breathCountdown');
  var rateSlowerBtn = document.getElementById('rateSlower');
  var rateFasterBtn = document.getElementById('rateFaster');
  var rateValueLabel = document.getElementById('rateValue');
  var breathHint = document.getElementById('breathHint');

  var contemplationIntro = document.getElementById('contemplationIntro');
  var contemplationTheme = document.getElementById('contemplationTheme');
  var contemplationPassage = document.getElementById('contemplationPassage');
  var contemplationBegin = document.getElementById('contemplationBegin');
  var contemplationGlow = document.getElementById('contemplationGlow');
  var contemplationClosing = document.getElementById('contemplationClosing');

  var breathPoem = document.getElementById('breathPoem');
  var poemLine = document.getElementById('poemLine');
  var poemAuthor = document.getElementById('poemAuthor');

  var countdownTimer = null;
  var breathPhaseTimer = null;
  var finaleTimer = null;
  var ritualTimers = [];
  var remainingSeconds = 0;
  var currentPracticeMode = 'breath';
  var currentPassageEntry = null;
  var contemplationMinutesPending = 0;

  var breathPeriod = 8;
  var INHALE_RATIO = 0.42;
  var MIN_PERIOD = 5;
  var MAX_PERIOD = 14;

  function bpmLabel(period){ return (60 / period).toFixed(1) + ' 次/分钟'; }
  function applyBreathRate(){
    rateValueLabel.textContent = bpmLabel(breathPeriod);
    breathBubble.style.animationDuration = breathPeriod + 's';
  }
  function restartBubbleAnimation(){
    breathBubble.style.animation = 'none';
    void breathBubble.offsetWidth;
    breathBubble.style.animation = '';
    applyBreathRate();
  }
  function resetBubbleFlourish(){
    breathBubble.style.animation = '';
    breathBubble.style.transform = '';
    breathBubble.style.boxShadow = '';
    breathBubble.style.transition = '';
  }
  function resetGlowFlourish(){
    contemplationGlow.style.animation = '';
    contemplationGlow.style.transform = '';
    contemplationGlow.style.boxShadow = '';
    contemplationGlow.style.opacity = '';
    contemplationGlow.style.transition = '';
  }

  function startMeditation(minutes){
    currentPracticeMode = 'breath';
    meditationLayer.classList.remove('mode-contemplate');

    document.body.classList.add('meditating');
    breathHint.classList.add('show');

    var CUE_APPEAR_AT = 650;
    var CUE_HOLD_MS = 1800;
    var CUE_FADE_OUT_MS = 900;
    var PROMPT_APPEAR_AT = CUE_APPEAR_AT + CUE_HOLD_MS + CUE_FADE_OUT_MS;
    var PROMPT_HOLD_MS = 4500;
    var PROMPT_FADE_OUT_MS = 900;
    var BUBBLE_APPEAR_AT = PROMPT_APPEAR_AT + PROMPT_HOLD_MS + PROMPT_FADE_OUT_MS;

    ritualTimers.push(setTimeout(function(){ meditationCue.classList.add('show'); }, CUE_APPEAR_AT));
    ritualTimers.push(setTimeout(function(){ meditationCue.classList.remove('show'); }, CUE_APPEAR_AT + CUE_HOLD_MS));
    ritualTimers.push(setTimeout(function(){
      mindfulnessPrompt.textContent = pickMindfulnessPrompt();
      mindfulnessPrompt.classList.add('show');
    }, PROMPT_APPEAR_AT));
    ritualTimers.push(setTimeout(function(){ mindfulnessPrompt.classList.remove('show'); }, PROMPT_APPEAR_AT + PROMPT_HOLD_MS));

    ritualTimers.push(setTimeout(function(){
      meditationLayer.classList.add('active');
      restartBubbleAnimation();
      scheduleBreathPhase(true);

      remainingSeconds = minutes * 60;
      updateCountdownDisplay();
      countdownTimer = setInterval(function(){
        remainingSeconds--;
        updateCountdownDisplay();
        if (remainingSeconds <= 0){ naturalEnd(); }
      }, 1000);
    }, BUBBLE_APPEAR_AT));
  }

  function startContemplation(minutes){
    currentPracticeMode = 'contemplate';
    meditationLayer.classList.add('mode-contemplate');
    contemplationMinutesPending = minutes;

    document.body.classList.add('meditating');
    breathHint.classList.add('show');

    var CUE_APPEAR_AT = 650;
    var CUE_HOLD_MS = 1800;
    var CUE_FADE_OUT_MS = 900;
    var INTRO_APPEAR_AT = CUE_APPEAR_AT + CUE_HOLD_MS + CUE_FADE_OUT_MS;

    ritualTimers.push(setTimeout(function(){ meditationCue.classList.add('show'); }, CUE_APPEAR_AT));
    ritualTimers.push(setTimeout(function(){ meditationCue.classList.remove('show'); }, CUE_APPEAR_AT + CUE_HOLD_MS));
    ritualTimers.push(setTimeout(function(){
      currentPassageEntry = pickPassage();
      contemplationTheme.textContent = currentPassageEntry.theme;
      contemplationPassage.textContent = currentPassageEntry.passage;
      contemplationIntro.classList.add('show');
    }, INTRO_APPEAR_AT));
  }

  contemplationBegin.addEventListener('click', function(e){
    e.stopPropagation();
    if (!document.body.classList.contains('meditating') || currentPracticeMode !== 'contemplate') return;
    contemplationIntro.classList.remove('show');

    var glowTimer = setTimeout(function(){
      meditationLayer.classList.add('active');
      remainingSeconds = contemplationMinutesPending * 60;
      updateCountdownDisplay();
      countdownTimer = setInterval(function(){
        remainingSeconds--;
        updateCountdownDisplay();
        if (remainingSeconds <= 0){ naturalEnd(); }
      }, 1000);
    }, 900);
    ritualTimers.push(glowTimer);
  });

  function scheduleBreathPhase(isInhale){
    breathText.textContent = isInhale ? '吸气...' : (Math.random() > 0.5 ? '呼气...' : '释怀...');
    breathText.style.opacity = '1';
    var phaseMs = (isInhale ? INHALE_RATIO : (1 - INHALE_RATIO)) * breathPeriod * 1000;
    var fadeLead = 300;
    breathPhaseTimer = setTimeout(function(){
      breathText.style.opacity = '0';
      setTimeout(function(){ scheduleBreathPhase(!isInhale); }, fadeLead);
    }, Math.max(300, phaseMs - fadeLead));
  }

  function changeBreathRate(deltaSeconds){
    breathPeriod = Math.min(MAX_PERIOD, Math.max(MIN_PERIOD, breathPeriod + deltaSeconds));
    restartBubbleAnimation();
    clearTimeout(breathPhaseTimer);
    scheduleBreathPhase(true);
  }
  rateSlowerBtn.addEventListener('click', function(e){ e.stopPropagation(); changeBreathRate(1); });
  rateFasterBtn.addEventListener('click', function(e){ e.stopPropagation(); changeBreathRate(-1); });

  function updateCountdownDisplay(){
    var m = Math.floor(remainingSeconds / 60);
    var s = remainingSeconds % 60;
    breathCountdown.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function exitMeditation(){
    meditationLayer.classList.remove('active');
    meditationLayer.classList.remove('finale');
    meditationLayer.classList.remove('mode-contemplate');
    meditationCue.classList.remove('show');
    mindfulnessPrompt.classList.remove('show');
    contemplationIntro.classList.remove('show');
    breathHint.classList.remove('show');
    currentPassageEntry = null;
    resetBubbleFlourish();
    resetGlowFlourish();

    setTimeout(function(){
      document.body.classList.remove('meditating');
      picker.classList.remove('hide');
      selectedMinutes = null;
      durationBtns.forEach(function(b){ b.classList.remove('selected'); });
      startBtn.classList.remove('enabled');
    }, 1200);
  }

  function clearMeditationTimers(){
    clearInterval(countdownTimer);
    clearTimeout(breathPhaseTimer);
    clearTimeout(finaleTimer);
    ritualTimers.forEach(clearTimeout);
    ritualTimers = [];
    countdownTimer = null;
    breathPhaseTimer = null;
    finaleTimer = null;
  }

  function naturalEnd(){
    clearMeditationTimers();

    if (currentPracticeMode === 'contemplate'){
      contemplationGlow.style.animation = 'none';
      contemplationGlow.style.transform = 'scale(2.4)';
      contemplationGlow.style.opacity = '1';
      contemplationGlow.style.transition = 'opacity 1.3s ease, transform 1.3s ease';
      contemplationGlow.style.boxShadow = '0 0 60px 20px rgba(255,255,255,0.5), 0 0 140px 46px rgba(255,255,255,0.2)';
    } else {
      breathText.style.opacity = '0';
      breathBubble.style.animation = 'none';
      breathBubble.style.transform = 'scale(1.95)';
      breathBubble.style.transition = 'box-shadow 1.3s ease, transform 1.3s ease';
      breathBubble.style.boxShadow = '0 0 90px 30px rgba(255,255,255,0.5), 0 0 200px 70px rgba(255,255,255,0.2)';
    }

    finaleTimer = setTimeout(function(){
      if (currentPracticeMode === 'contemplate' && currentPassageEntry){
        contemplationClosing.textContent = currentPassageEntry.closing;
      } else {
        var poem = pickPoem();
        poemLine.textContent = poem.line;
        poemAuthor.textContent = poem.author;
      }
      meditationLayer.classList.add('finale');

      finaleTimer = setTimeout(function(){ exitMeditation(); }, 8000);
    }, 1300);
  }

  function endMeditation(){
    clearMeditationTimers();
    exitMeditation();
  }

  window.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.body.classList.contains('meditating')){
      endMeditation();
    }
  });

  var lastTap = 0;
  document.addEventListener('touchend', function(){
    var now = Date.now();
    if (now - lastTap < 350 && document.body.classList.contains('meditating')){
      endMeditation();
    }
    lastTap = now;
  });

})();
</script>

</body>
</html>
